<style>
/* Redstick brand (ink #0A0504, red #C8151D as an accent only, warm white #F4F1EC, Sora + Noto Sans KR).
   Look: quiet and instrument-like - hairline borders, glass panel, big numerals with small units, red kept for the start button, the bar and the selected state.
   Layout: the whole screen is the track (the bar runs from the top edge to the bottom edge); a floating panel holds the home, settings and tempo-picker views. While running only the logo and a hint stay. */
:root {
  --bg: #0A0504;
  --surface: #141010;
  --surface-2: #1A1514;
  --hair: rgba(244, 241, 236, 0.10);
  --hair-2: rgba(244, 241, 236, 0.20);
  --fg: #F4F1EC;
  --muted: #9C9692;
  --accent: #C8151D;
  --accent-hi: #CB181C;
  --accent-lo: #A8060A;
  --on-accent: #FFFFFF;
  --warm: #F4F1EC;
  --ball: 84px;
  --r-btn: 14px;
  --r-card: 16px;
  --font: "Noto Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-display: "Sora", "Noto Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 70% at 50% 28%, #1a100f 0%, #0A0504 62%);
  color: var(--fg);
  font-family: var(--font);
  overflow: hidden;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  overscroll-behavior: none;
  cursor: default;
}
.track { position: fixed; inset: 0; background: radial-gradient(120% 70% at 50% 28%, #1a100f 0%, #0A0504 62%); overflow: hidden; }
.bar {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 14px;
  background: linear-gradient(180deg, #DC2229 0%, var(--accent-lo) 100%);
  box-shadow: 0 0 26px rgba(200, 21, 29, 0.5);
  will-change: transform;
}
.bar.hit { background: var(--fg); box-shadow: 0 0 26px rgba(244, 241, 236, 0.5); }
.bar.turn { background: var(--fg); box-shadow: 0 0 40px 14px rgba(255, 255, 255, 0.75), 0 -24px 60px 10px rgba(255, 255, 255, 0.4); }
.ball {
  /* always the top layer: lives outside the track, above panels and settings */
  position: fixed;
  z-index: 1000;
  pointer-events: none;
  top: calc(-0.5 * var(--ball));
  left: 50%;
  width: var(--ball);
  height: var(--ball);
  margin-left: calc(-0.5 * var(--ball));
  border-radius: 50%;
  background: #ece8e1;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10), 0 12px 28px rgba(0, 0, 0, 0.8);
  transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
}
.ball svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 50%; }
.ball.hit { transform: translateY(5px) scale(1.06); box-shadow: 0 0 0 4px rgba(200, 21, 29, 0.55), 0 12px 28px rgba(0, 0, 0, 0.8); }

/* ---- panel ---- */
.panel {
  /* app shell: full screen, no card. Views are centered columns; the main action sits at the bottom. */
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  overscroll-behavior: none;
  padding: calc(env(safe-area-inset-top, 0px) + 30px) max(24px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 96px) max(24px, env(safe-area-inset-left, 0px));
  scrollbar-width: none;
}
.panel::-webkit-scrollbar { display: none; }
.home, .settings, .measure { display: flex; flex-direction: column; gap: 20px; flex: 1; width: 100%; max-width: 420px; margin-inline: auto; }
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 46px; }
.home > .mode { margin-top: 6px; }
.home > .facts2 { margin-top: auto; }
.home > .go { margin-top: auto; }
.measure > .go { margin-top: auto; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.home > .head { justify-content: flex-start; }
h1, h2 { margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.015em; }
h2 { font-size: 18px; }
.logo { display: block; height: 26px; width: auto; align-self: flex-start; }
.kicker { margin: 0 0 6px; font: 600 10.5px/1 var(--font-display); letter-spacing: 0.26em; text-transform: uppercase; color: var(--accent); }
.tip { margin: 0; font-size: 14px; line-height: 1.75; color: var(--muted); text-align: center; text-wrap: balance; word-break: keep-all; }
.label { margin: 0; font: 600 11px/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.msg { margin: 0; min-height: 1.6em; font-size: 14px; font-weight: 700; color: var(--warm); }
button { -webkit-tap-highlight-color: transparent; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.18s, border-color 0.18s, color 0.18s, opacity 0.18s, box-shadow 0.18s; }
button:active { transform: scale(0.955); transition-duration: 0.09s, 0.18s, 0.18s, 0.18s, 0.18s, 0.18s; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

/* ---- buttons ---- */
.icon-btn {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  border: 1px solid var(--hair-2);
  background: rgba(255, 255, 255, 0.03);
  color: var(--fg);
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.icon-btn:active { background: rgba(255, 255, 255, 0.09); }
.icon-btn:disabled { opacity: 0.3; cursor: default; }
.go {
  width: 100%;
  min-height: 66px;
  border-radius: 16px;
  border: 0;
  background: linear-gradient(180deg, var(--accent-hi) 0%, var(--accent-lo) 100%);
  color: var(--on-accent);
  font: 700 21px/1 var(--font-display);
  letter-spacing: 0.04em;
  cursor: pointer;
  box-shadow: 0 12px 30px rgba(200, 21, 29, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.22);
}
.go:active { transform: scale(0.97); box-shadow: 0 6px 18px rgba(200, 21, 29, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.18); }
.go:disabled { opacity: 0.4; cursor: default; }
.ghost {
  width: 100%;
  min-height: 48px;
  border-radius: var(--r-btn);
  border: 1px solid var(--hair-2);
  background: transparent;
  color: var(--fg);
  font: 600 15px var(--font);
  cursor: pointer;
}
.auto-hint { margin: 0; text-align: center; font: 600 13px/1.4 var(--font); color: var(--warm); display: flex; align-items: center; justify-content: center; gap: 9px; }
.auto-hint::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: wait 1.6s ease-in-out infinite; }
@keyframes wait { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.15); } }
.vtitle { margin: 0; font: 700 28px/1.15 var(--font-display); letter-spacing: -0.02em; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 8px) max(12px, env(safe-area-inset-left, 0px));
  background: rgba(12, 8, 7, 0.82); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3);
  border-top: 1px solid var(--hair); transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s; }
.tabbar-in { position: relative; display: flex; width: 100%; max-width: 420px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 54px; padding: 6px 0 2px; background: transparent; border: 0; color: var(--muted); font: 600 11px/1 var(--font); letter-spacing: 0.02em; cursor: pointer; }
.tab svg { display: block; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.tab[aria-selected="true"] { color: var(--fg); }
.tab[aria-selected="true"] svg { transform: translateY(-1px) scale(1.1); }
.tab-ind { position: absolute; top: -9px; left: 0; width: 30px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); box-shadow: 0 2px 14px rgba(200, 21, 29, 0.75); transition: transform 0.42s cubic-bezier(0.34, 1.3, 0.64, 1); }
.is-running .tabbar { transform: translateY(110%); opacity: 0; pointer-events: none; }
.acc-link { display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 0 16px; border: 1px solid var(--hair); border-radius: 14px; background: var(--surface-2); color: var(--fg); font: 600 15px var(--font); text-decoration: none; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.acc-link:active { transform: scale(0.975); transition-duration: 0.09s; }
.rs-banner { display: block; padding: 18px 16px 16px; border: 1px solid var(--hair); border-radius: 14px; background: var(--surface-2); color: var(--fg); text-decoration: none; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
.rs-banner:active { transform: scale(0.975); transition-duration: 0.09s; }
.rs-banner .kicker { margin-bottom: 10px; }
.rs-banner h3 { margin: 0 0 6px; font: 700 17px/1.35 var(--font); }
.rs-body { margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--muted); word-break: keep-all; }
.rs-sign { margin: 12px 0 0; font: 600 12px/1.4 var(--font-display); letter-spacing: 0.02em; color: var(--fg); }
.rs-cta { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; min-height: 44px; padding: 0 16px; border-radius: 12px; background: linear-gradient(180deg, var(--accent-hi) 0%, var(--accent-lo) 100%); color: #fff; font: 700 14px var(--font); }
.acc-link .acc-v { flex: 1; }
.sheet { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); z-index: 30; max-width: 420px; margin-inline: auto; padding: 16px; border-radius: 20px; background: rgba(28, 22, 21, 0.94); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid var(--hair-2); box-shadow: 0 22px 54px rgba(0, 0, 0, 0.65); display: flex; flex-direction: column; gap: 12px; }
.sheet strong { font: 700 15px/1.4 var(--font); word-break: keep-all; }
.sheet p { margin: 0; font: 400 13px/1.6 var(--font); color: var(--muted); word-break: keep-all; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; }
.sm { width: auto; min-height: 44px; padding: 0 20px; font-size: 14px; letter-spacing: 0; border-radius: 12px; }
.go.sm { font-family: var(--font); font-weight: 700; box-shadow: none; }
.splash { position: fixed; inset: 0; z-index: 3000; background: #0A0504; display: grid; place-items: center; }
.splash img { height: 36px; width: auto; animation: splashIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
@keyframes splashIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
.scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, 0.6); }
.howto { z-index: 40; gap: 14px; max-height: calc(100dvh - 120px); overflow-y: auto; }
.howto-title { font: 700 20px/1.2 var(--font-display); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.steps li { display: flex; gap: 12px; align-items: flex-start; font: 400 14px/1.6 var(--font); color: var(--fg); word-break: keep-all; }
.steps i { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 700 12px/1 var(--font-display); font-style: normal; color: var(--fg); background: rgba(200, 21, 29, 0.22); border: 1px solid var(--accent); margin-top: 1px; }
button.acc-link { width: 100%; text-align: left; background: var(--surface-2); cursor: pointer; }
.brand { align-self: center; font: 600 12px var(--font-display); color: var(--muted); text-decoration: none; letter-spacing: 0.1em; padding: 6px 10px; }

/* ---- segmented controls ---- */
.mode, .pills { position: relative; display: flex; gap: 4px; padding: 4px; border: 1px solid var(--hair); border-radius: 16px; background: rgba(255, 255, 255, 0.025); }
.pill {
  white-space: nowrap;
  flex: 1 1 0;
  min-height: 42px;
  padding-inline: 8px;
  border-radius: 12px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font: 600 14px var(--font);
  cursor: pointer;
}
.pill { position: relative; z-index: 1; }
.pill[aria-pressed="true"] { color: #0A0504; }
.seg-thumb { position: absolute; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 12px; background: var(--warm); z-index: 0; pointer-events: none; transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }

/* ---- icon cards ---- */
.sounds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sounds.two { grid-template-columns: repeat(2, 1fr); }
.snd {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 90px;
  padding: 10px 4px;
  border-radius: var(--r-card);
  border: 1px solid var(--hair);
  background: var(--surface-2);
  color: var(--muted);
  font: 600 13px var(--font);
  cursor: pointer;
}
.snd svg { display: block; }
.snd[aria-pressed="true"] { background: rgba(200, 21, 29, 0.16); border-color: var(--accent); color: var(--fg); box-shadow: inset 0 0 22px rgba(200, 21, 29, 0.16); }
.snd small { font: 500 12px/1 var(--font); color: var(--muted); margin-top: -3px; }
.snd[aria-pressed="true"] small { color: var(--fg); }

/* ---- home numbers ---- */
.facts2 { display: flex; justify-content: center; font-variant-numeric: tabular-nums; }
.fact { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 26px; }
.fact + .fact { border-left: 1px solid var(--hair-2); }
.fl { font: 600 10.5px/1 var(--font); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.fact strong, .stepval strong { font: 600 40px/1 var(--font-display); letter-spacing: -0.03em; white-space: nowrap; color: var(--warm); }
.u { margin-left: 3px; font: 500 14px var(--font); letter-spacing: 0; color: var(--muted); }
.ratio-line { margin: -6px 0 0; text-align: center; font: 500 13px/1.4 var(--font-display); letter-spacing: 0.06em; color: var(--muted); font-variant-numeric: tabular-nums; }
.type-line { text-align: center; color: var(--accent); font: 700 12px/1 var(--font); letter-spacing: 0.2em; margin-top: -4px; }

/* ---- tempo picker ---- */
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper .icon-btn { width: 60px; height: 56px; font: 500 26px/1 var(--font-display); }
.stepval { display: flex; flex-direction: column; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.stepval strong { font-size: 36px; }
@keyframes tick { from { transform: scale(1.07); } to { transform: none; } }
.tick { animation: tick 0.22s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes pop { 0% { transform: scale(0.88); } 100% { transform: scale(1); } }
.snd.pop { animation: pop 0.36s cubic-bezier(0.34, 1.56, 0.64, 1); }
.stepval > span { color: var(--accent); font: 700 12px var(--font); letter-spacing: 0.18em; }

/* ---- settings rows ---- */
.acc { border: 1px solid var(--hair); border-radius: 14px; background: var(--surface-2); overflow: hidden; }
.acc-h { width: 100%; min-height: 58px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: transparent; border: 0; color: var(--fg); font: 600 15px var(--font); cursor: pointer; text-align: left; }
.acc-t { flex: none; }
.acc-v { flex: 1; min-width: 0; text-align: right; color: var(--muted); font: 500 13px var(--font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { flex: none; color: var(--muted); transition: transform 0.18s; }
.acc-h[aria-expanded="true"] .chev { transform: rotate(180deg); }
.acc-w { display: grid; grid-template-rows: 0fr; visibility: hidden; transition: grid-template-rows 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s 0.3s; }
.acc.open .acc-w { grid-template-rows: 1fr; visibility: visible; transition: grid-template-rows 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), visibility 0s 0s; }
.acc-b { min-height: 0; overflow: hidden; }
.acc-i { display: flex; flex-direction: column; gap: 12px; padding: 4px 12px 16px; border-top: 1px solid var(--hair); }
.acc-i .label.sub { margin-top: 6px; }

/* ---- turnaround cues ---- */
.ripple { position: absolute; left: 50%; width: 360px; height: 360px; border-radius: 50%; border: 5px solid var(--fg); background: rgba(200, 21, 29, 0.18); pointer-events: none; }
.cue { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; box-shadow: inset 0 0 130px 46px rgba(200, 21, 29, 0.95); }
.cue-bottom { position: fixed; left: 0; right: 0; bottom: 0; height: 42%; z-index: 5; pointer-events: none; opacity: 0; background: linear-gradient(to top, rgba(200, 21, 29, 0.95), rgba(200, 21, 29, 0.55) 45%, rgba(200, 21, 29, 0)); }

/* running: the phone lies flat and the player looks down at it, so the stroke runs left-right in their view
   (phone top -> bottom = player's left -> right). Rotate the whole UI 90deg so the logo and text read upright:
   logo top-left, hint top-right. Tapping anywhere stops. Left-handed players get the mirrored rotation. */
.panel.running {
  inset: 0;
  transform: none;
  max-width: none;
  max-height: none;
  margin: 0;
  padding: 0;
  overflow: visible;
  background: transparent;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: none;
  border: 0;
  pointer-events: none;
}
.panel.running .topbar { display: contents; }
.panel.running .home {
  max-width: none;
  margin: 0;
  gap: 0;
  display: block;
  position: absolute;
  left: 0;
  top: 0;
  width: 100vh;
  width: 100dvh;
  height: 100vw;
  transform-origin: 0 0;
  transform: translateX(100vw) rotate(90deg);
  --lead: 46px;
  --side: 18px;
}
.panel.running.lefty .home { transform: translateY(100vh) rotate(-90deg); transform: translateY(100dvh) rotate(-90deg); --lead: 18px; --side: 46px; }
.panel.running .extra:not(.logo) { display: none; }
.panel.running .logo { position: absolute; left: var(--lead); top: 18px; height: 20px; opacity: 0.9; }
.panel.running .go {
  position: absolute;
  right: var(--side);
  top: 18px;
  width: auto;
  min-height: 0;
  padding: 0;
  background: transparent;
  box-shadow: none;
  color: var(--muted);
  font: 500 13px/1.3 var(--font);
  letter-spacing: 0;
  text-align: right;
  opacity: 0.32;
}
</style>

<div id="splash" class="splash" aria-hidden="true"><img alt=""></div>

<div id="track" class="track" aria-hidden="true">
  <div id="bar" class="bar"></div>
</div>

<main id="panel" class="panel">

  var wasHit = false;
  var wakeLock = null;

  try {
    var saved = localStorage.getItem('putting-tempo-sound');
    var sb = saved && document.querySelector('[data-sound="' + saved + '"]');
    if (sb) sound = saved;
  } catch (e) {}

  function renderSettings() {
    soundBtns.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-sound') === sound));
    });
  }

  function ensureCtx() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    if (!ctx) ctx = new AC();
    if (ctx.resume) ctx.resume();
    return true;
  }

  // Envelope helper: fast attack, exponential decay.
  function env(g, t, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  // kind: 'start' (backswing begins, lower) or 'impact' (higher, shorter). Every sound has a sharp attack for timing.
  function play(t, kind, name) {
    var snd = name || sound;
    var imp = kind === 'impact';
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    var dur = 0.12;
    var peak = 0.6;

    if (snd === 'tick') {
      osc.type = 'sine';
      osc.frequency.value = imp ? 1320 : 880;
    } else if (snd === 'wood') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(imp ? 900 : 620, t);
      osc.frequency.exponentialRampToValueAtTime(imp ? 600 : 400, t + 0.05);
      dur = 0.09;
    } else if (snd === 'bell') {
      osc.type = 'sine';
      osc.frequency.value = imp ? 1568 : 1046;
      var h = ctx.createOscillator();
      var hg = ctx.createGain();
      h.type = 'sine';
      h.frequency.value = (imp ? 1568 : 1046) * 2.76;
      env(hg, t, 0.18, 0.25);
      h.connect(hg);
      hg.connect(ctx.destination);
      h.start(t);
      h.stop(t + 0.3);
      dur = 0.35;
      peak = 0.5;
    } else if (snd === 'drum') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(imp ? 220 : 150, t);
      osc.frequency.exponentialRampToValueAtTime(imp ? 90 : 55, t + 0.12);
      dur = 0.2;
      peak = 0.9;
    } else if (snd === 'bomb') {   // fuse hiss at the start, boom at impact
      var nlen = imp ? 0.4 : 0.25;
      var nb = ctx.createBuffer(1, Math.floor(ctx.sampleRate * nlen), ctx.sampleRate);
      var nd = nb.getChannelData(0);
      for (var i = 0; i < nd.length; i++) {
        nd[i] = (Math.random() * 2 - 1) * (imp ? Math.pow(1 - i / nd.length, 2) : 1);
      }
      var ns = ctx.createBufferSource();
      var nf = ctx.createBiquadFilter();
      var ng = ctx.createGain();
      ns.buffer = nb;
      nf.type = imp ? 'lowpass' : 'highpass';
      nf.frequency.value = imp ? 900 : 3000;
      ns.connect(nf);
      nf.connect(ng);
      ng.connect(ctx.destination);
      env(ng, t, imp ? 0.7 : 0.35, nlen);
      ns.start(t);
      if (imp) {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(35, t + 0.35);
        env(gain, t, 0.95, 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.55);
      }
      return;
    } else {   // fart
      osc.type = 'sawtooth';
      var f0 = imp ? 150 : 100;
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f0 * 0.55, t + (imp ? 0.14 : 0.32));
      var lfo = ctx.createOscillator();
      var lg = ctx.createGain();
      lfo.type = 'sine';
      lfo.frequency.value = 30;
      lg.gain.value = 22;
      lfo.connect(lg);
      lg.connect(osc.frequency);
      lfo.start(t);
      lfo.stop(t + 0.4);
      var lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 420;
      osc.connect(lp);
      lp.connect(gain);
      dur = imp ? 0.15 : 0.34;
      env(gain, t, 0.8, dur);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.05);
      return;
    }

    env(gain, t, peak, dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.03);
  }

  function preview(name) {
    if (!ensureCtx()) return;
    var t0 = ctx.currentTime + 0.03;
    play(t0, 'start', name);
    play(t0 + 0.4, 'impact', name);
  }

  function schedule() {
    while (baseT + nextN * CYCLE < ctx.currentTime + 0.2) {
      var s = baseT + nextN * CYCLE;
      play(s, 'start');
      play(s + STROKE, 'impact');
      nextN += 1;
    }
    timer = setTimeout(schedule, 25);
  }

  function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

  function frame() {
    if (!running) return;
    var t = ctx.currentTime - baseT;
    var travel = trackEl.clientHeight - barEl.offsetHeight;   // very top to very bottom
    var y = 0;
    var hit = false;
    var inTurn = false;
    if (t >= 0) {
      var ph = t % CYCLE;
      inTurn = ph >= BACK - lead && ph < BACK - lead + 0.16;
      if (ph < BACK) {
        y = easeInOut(ph / BACK);
      } else if (ph < STROKE) {
        y = 1 - easeInOut((ph - BACK) / FWD);
      } else {
        y = 0;
        hit = ph < STROKE + 0.18;
      }
    }
    barEl.style.transform = 'translateY(' + (y * travel) + 'px)';
    if (inTurn !== wasTurn) {
      if (turnFx === 'flash') barEl.classList.toggle('turn', inTurn);
      if (inTurn) fireTurn(turnFx, false);
      wasTurn = inTurn;
    }
    if (hit !== wasHit) {
      barEl.classList.toggle('hit', hit);
      ballEl.classList.toggle('hit', hit);
      wasHit = hit;
    }
    raf = requestAnimationFrame(frame);
  }

  function lockScreen() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () {});
      }
    } catch (e) {}
  }

  function unlockScreen() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }

  function start() {
    if (!ensureCtx()) return;
    running = true;
    baseT = ctx.currentTime + 1.2;
    nextN = 0;
    schedule();
    panelEl.classList.add('running');
    document.body.classList.add('is-running');
    runs += 1;
    try { localStorage.setItem('putting-tempo-runs', String(runs)); } catch (e) {}
    if (panelEl.animate) panelEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, easing: 'ease-out' });
    goBtn.textContent = t('stop');
    goBtn.setAttribute('aria-pressed', 'true');
    lockScreen();
    raf = requestAnimationFrame(frame);
  }

  function stop() {
    running = false;
    clearTimeout(timer);
    cancelAnimationFrame(raf);
    barEl.style.transform = 'translateY(0)';
    barEl.classList.remove('hit', 'turn');
    ballEl.classList.remove('hit');
    wasTurn = false;
    wasHit = false;
    panelEl.classList.remove('running');
    document.body.classList.remove('is-running');
    if (panelEl.animate) panelEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: 'ease-out' });
    goBtn.textContent = t('start');
    goBtn.setAttribute('aria-pressed', 'false');
    armed = false;
    if (!autoOn) unlockScreen();
  }


  goBtn.addEventListener('click', function () {
    if (running) stop(); else start();
  });

  soundBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var name = b.getAttribute('data-sound');
      preview(name);
      sound = name;
      try { localStorage.setItem('putting-tempo-sound', sound); } catch (e) {}
      renderSettings();
    });
  });

  // Tap anywhere on the home view to start / stop (buttons, links and the settings view are excluded).
  document.addEventListener('click', function (e) {
    if (e.target.closest('button, a, #settings, #measure')) return;
    if (!settingsEl.hidden || !document.getElementById('measure').hidden) return;
    if (running) stop(); else start();
  });

  // ---- my tempo: picked by feel (presets + fine-tune), not measured ----
  var measureEl = document.getElementById('measure');
  var mode = 'tour';
  var mine = null;

  try {
    var m = JSON.parse(localStorage.getItem('putting-tempo-mine') || 'null');
    if (m && m.back > 0.2 && m.fwd > 0.1) mine = m;
  } catch (e) {}
  try { if (mine && localStorage.getItem('putting-tempo-mode') === 'mine') mode = 'mine'; } catch (e) {}

  function applyTempo() {
    var T = (mode === 'mine' && mine) ? mine : TOUR;
    BACK = T.back;
    FWD = T.fwd;
    STROKE = BACK + FWD;
    CYCLE = STROKE + 1;
  }

  function renderHome() {
    document.getElementById('modeTour').setAttribute('aria-pressed', String(mode === 'tour'));
    document.getElementById('modeMine').setAttribute('aria-pressed', String(mode === 'mine'));
    document.getElementById('factBack').innerHTML = numUnit(t('sec')(BACK.toFixed(2)));
    document.getElementById('factFwd').innerHTML = numUnit(t('sec')(FWD.toFixed(2)));
    document.getElementById('factRatio').textContent = (BACK / FWD).toFixed(1) + ' : 1';
    document.getElementById('factTotal').textContent = t('total')(+STROKE.toFixed(2));
    document.getElementById('homeTip').hidden = runs >= 3;
    var sig = BACK + '|' + FWD;
    if (sig !== lastFacts) {
      if (lastFacts !== null) { pulse(document.getElementById('factBack')); pulse(document.getElementById('factFwd')); }
      lastFacts = sig;
    }
    var ht = document.getElementById('homeType');
    ht.hidden = !(mode === 'mine' && mine);
    if (!ht.hidden) ht.textContent = t('type_' + typeOf(mine));
    var ah = document.getElementById('autoHint');
    if (ah) { ah.hidden = !autoOn; if (autoOn) ah.textContent = t('autoHint'); }
  }

  function setMode(next) {
    if (running) stop();
    if (next === 'mine' && !mine) { showMeasure(true); return; }
    mode = next;
    try { localStorage.setItem('putting-tempo-mode', mode); } catch (e) {}
    applyTempo();
    renderHome();
  }

  var draft = { back: 0.6, fwd: 0.3 };
  var MIN_TOTAL = 0.6;
  var MAX_TOTAL = 1.5;

  // "Find my tempo" is by feel: pick a preset or nudge the total time; the 2:1 ratio is kept.
  function setDraftTotal(total) {
    total = Math.min(MAX_TOTAL, Math.max(MIN_TOTAL, total));
    draft = { back: +(total * 2 / 3).toFixed(3), fwd: +(total / 3).toFixed(3) };
  }


  function renderMeasure() {
    var total = draft.back + draft.fwd;
    document.getElementById('draftTotal').innerHTML = numUnit(t('sec')(total.toFixed(2)));
    document.getElementById('draftType').textContent = t('type_' + typeOf(draft));
    document.getElementById('stepDown').disabled = total <= MIN_TOTAL + 0.001;
    document.getElementById('stepUp').disabled = total >= MAX_TOTAL - 0.001;
    Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
      var P = PRESETS[b.getAttribute('data-preset')];
      b.setAttribute('aria-pressed', String(Math.abs(P.back + P.fwd - total) < 0.005));
    });
  }

  function nudge(delta) {
    setDraftTotal(Math.round((draft.back + draft.fwd + delta) * 100) / 100);
    renderMeasure();
    pulse(document.getElementById('draftTotal'));
  }

  // 0.01 s per step; hold the button to keep stepping (faster after a while)
  function holdStep(id, delta) {
    var el = document.getElementById(id);
    var timer = null;
    var n = 0;
    function tick() {
      nudge(delta);
      n += 1;
      timer = setTimeout(tick, n < 8 ? 120 : 50);
    }
    function end() { clearTimeout(timer); timer = null; n = 0; }
    el.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      if (el.disabled) return;
      nudge(delta);
      timer = setTimeout(tick, 450);
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { el.addEventListener(ev, end); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); nudge(delta); }
    });
  }
  holdStep('stepDown', -0.01);
  holdStep('stepUp', 0.01);
  document.getElementById('mineSave').addEventListener('click', function () {
    mine = { back: draft.back, fwd: draft.fwd };
    try { localStorage.setItem('putting-tempo-mine', JSON.stringify(mine)); } catch (e) {}
    mode = 'mine';
    try { localStorage.setItem('putting-tempo-mode', mode); } catch (e) {}
    applyTempo();
    showMeasure(false);
  });
  document.getElementById('modeTour').addEventListener('click', function () { setMode('tour'); });
  document.getElementById('modeMine').addEventListener('click', function () { setMode('mine'); });

  var hand = 'r';
  try { if (localStorage.getItem('putting-tempo-hand') === 'l') hand = 'l'; } catch (e) {}

  function applyHand() {
    panelEl.classList.toggle('lefty', hand === 'l');
    Array.prototype.forEach.call(document.querySelectorAll('[data-hand]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-hand') === hand));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-hand]'), function (b) {
    b.addEventListener('click', function () {
      hand = b.getAttribute('data-hand');
      try { localStorage.setItem('putting-tempo-hand', hand); } catch (e) {}
      applyHand();
    });
  });

  // Golf ball: ~400 dimples on a Fibonacci sphere, orthographic projection (foreshortened toward the rim), then sphere shading + specular.
  (function buildBall() {
    var N = 400, DR = 0.04, tilt = 0.5;
    var NS = 'http://www.w3.org/2000/svg';
    var out = [];
    for (var i = 0; i < N; i++) {
      var y0 = 1 - 2 * (i + 0.5) / N;
      var rr = Math.sqrt(1 - y0 * y0);
      var th = i * 2.399963;
      var x = Math.cos(th) * rr;
      var y1 = y0;
      var z1 = Math.sin(th) * rr;
      // tilt about the x axis so the spiral pole is not in view
      var y = y1 * Math.cos(tilt) - z1 * Math.sin(tilt);
      var z = y1 * Math.sin(tilt) + z1 * Math.cos(tilt);
      if (z < 0.1) continue;
      var sy = -y;
      var ang = Math.atan2(sy, x) * 180 / Math.PI;
      var rx = (DR * Math.max(z, 0.15)).toFixed(4);
      var ry = DR.toFixed(4);
      var g = 'translate(' + x.toFixed(4) + ' ' + sy.toFixed(4) + ') rotate(' + ang.toFixed(1) + ')';
      var gl = 'translate(' + (x + 0.011).toFixed(4) + ' ' + (sy + 0.011).toFixed(4) + ') rotate(' + ang.toFixed(1) + ')';
      out.push('<ellipse transform="' + gl + '" rx="' + rx + '" ry="' + ry + '" fill="#fff" opacity="0.75"/>');
      out.push('<ellipse transform="' + g + '" rx="' + rx + '" ry="' + ry + '" fill="#6b5f52" opacity="' + (0.16 + 0.1 * z).toFixed(2) + '"/>');
    }
    var svg = '<svg viewBox="-1 -1 2 2" aria-hidden="true">' +
      '<defs>' +
      '<radialGradient id="bBase" cx="0.4" cy="0.62" r="0.85"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#f5f1ea"/><stop offset="0.8" stop-color="#d8d1c6"/><stop offset="1" stop-color="#a39a8d"/></radialGradient>' +
      '<radialGradient id="bShade" cx="0.4" cy="0.58" r="0.62"><stop offset="0.55" stop-color="#2a1f14" stop-opacity="0"/><stop offset="1" stop-color="#2a1f14" stop-opacity="0.5"/></radialGradient>' +
      '<radialGradient id="bSpec" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>' +
      '</defs>' +
      '<circle r="1" fill="url(#bBase)"/>' + out.join('') +
      '<circle r="1" fill="url(#bShade)"/>' +
      '<ellipse cx="-0.3" cy="0.32" rx="0.26" ry="0.12" transform="rotate(-24 -0.3 0.32)" fill="url(#bSpec)"/>' +
      '</svg>';
    ballEl.insertAdjacentHTML('afterbegin', svg);
  })();

  // Turnaround cue: fires when the bar reaches the bottom (backswing -> forward). Choose it in settings.
  var turnFx = 'screen';
  var TURN_FX = ['off', 'screen', 'bottom', 'flash', 'ring', 'buzz'];
  var LEADS = [0, 0.1, 0.2];
  var lead = 0;
  try {
    var savedLead = parseFloat(localStorage.getItem('putting-tempo-lead'));
    if (LEADS.indexOf(savedLead) >= 0) lead = savedLead;
  } catch (e) {}
  var canBuzz = !!navigator.vibrate;
  try {
    var savedFx = localStorage.getItem('putting-tempo-turn');
    if (TURN_FX.indexOf(savedFx) >= 0 && (savedFx !== 'buzz' || canBuzz)) turnFx = savedFx;
  } catch (e) {}
  var wasTurn = false;

  function fireTurn(fx, preview) {
    if (fx === 'flash' && preview) {
      barEl.classList.add('turn');
      setTimeout(function () { barEl.classList.remove('turn'); }, 220);
    } else if (fx === 'ring' && barEl.animate) {
      var el = document.createElement('div');
      el.className = 'ripple';
      var r = barEl.getBoundingClientRect();
      el.style.top = (r.top + r.height / 2) + 'px';
      trackEl.appendChild(el);
      var a = el.animate([
        { transform: 'translate(-50%, -50%) scale(0.15)', opacity: 0.95 },
        { transform: 'translate(-50%, -50%) scale(1)', opacity: 0 }
      ], { duration: 480, easing: 'ease-out' });
      a.onfinish = function () { el.remove(); };
    } else if (fx === 'screen') {
      var cue = document.getElementById('cue');
      if (cue.animate) cue.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 460, easing: 'ease-out' });
    } else if (fx === 'bottom') {
      var cb = document.getElementById('cueBottom');
      if (cb.animate) cb.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 460, easing: 'ease-out' });
    } else if (fx === 'buzz' && canBuzz) {
      navigator.vibrate(40);
    }
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-lead]'), function (b) {
    b.addEventListener('click', function () {
      lead = parseFloat(b.getAttribute('data-lead'));
      try { localStorage.setItem('putting-tempo-lead', String(lead)); } catch (e) {}
      applyTurn();
      fireTurn(turnFx, true);
    });
  });

  function applyTurn() {
    var buzzBtn = document.querySelector('[data-turn="buzz"]');
    if (buzzBtn) buzzBtn.hidden = !canBuzz;
    Array.prototype.forEach.call(document.querySelectorAll('[data-turn]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-turn') === turnFx));
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lead]'), function (b) {
      b.setAttribute('aria-pressed', String(parseFloat(b.getAttribute('data-lead')) === lead));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-turn]'), function (b) {
    b.addEventListener('click', function () {
      turnFx = b.getAttribute('data-turn');
      try { localStorage.setItem('putting-tempo-turn', turnFx); } catch (e) {}
      applyTurn();
      fireTurn(turnFx, true);
    });
  });

  var BAR_SIZES = [8, 14, 24];
  var barSize = 14;
  try {
    var savedBar = parseInt(localStorage.getItem('putting-tempo-bar'), 10);
    if (BAR_SIZES.indexOf(savedBar) >= 0) barSize = savedBar;
  } catch (e) {}

  function applyBar() {
    barEl.style.height = barSize + 'px';
    Array.prototype.forEach.call(document.querySelectorAll('[data-bar]'), function (b) {
      b.setAttribute('aria-pressed', String(parseInt(b.getAttribute('data-bar'), 10) === barSize));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-bar]'), function (b) {
    b.addEventListener('click', function () {
      barSize = parseInt(b.getAttribute('data-bar'), 10);
      try { localStorage.setItem('putting-tempo-bar', String(barSize)); } catch (e) {}
      applyBar();
    });
  });

  var PRESETS = { slow: { back: 0.73, fwd: 0.37 }, tour: { back: 0.6, fwd: 0.3 }, fast: { back: 0.5, fwd: 0.25 } };

  // Type by total stroke time vs. the 0.9 s tour average.
  function typeOf(T) {
    var total = Math.round((T.back + T.fwd) * 100) / 100;
    return total < 0.85 ? 'fast' : total > 1.0 ? 'slow' : 'tour';
  }

  function renderPresets() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-preset-sec]'), function (el) {
      var T = PRESETS[el.getAttribute('data-preset-sec')];
      el.textContent = t('sec')(+(T.back + T.fwd).toFixed(2));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
    b.addEventListener('click', function () {
      var P = PRESETS[b.getAttribute('data-preset')];
      setDraftTotal(P.back + P.fwd);
      renderMeasure();
    });
  });

  // Settings are an accordion: one row per setting showing the current value; tap a row to open it.
  var accHeads = Array.prototype.slice.call(document.querySelectorAll('.acc-h'));

  function setAcc(head, open) {
    head.setAttribute('aria-expanded', String(open));
    head.parentElement.classList.toggle('open', open);
  }

  accHeads.forEach(function (h) {
    h.addEventListener('click', function () {
      var open = h.getAttribute('aria-expanded') !== 'true';
      accHeads.forEach(function (o) { setAcc(o, false); });
      setAcc(h, open);
      if (open) {
        setTimeout(function () { h.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, 300);
        syncSegs();
      }
    });
  });

  function pressedText(sel) {
    var el = document.querySelector(sel + '[aria-pressed="true"]');
    return el ? el.textContent.trim() : '';
  }

  function renderSummaries() {
    var turn = pressedText('[data-turn]');
    var ld = pressedText('[data-lead]');
    document.getElementById('accv-sound').textContent = pressedText('[data-sound]');
    document.getElementById('accv-turn').textContent = turn + (lead > 0 ? ' · ' + ld : '');
    document.getElementById('accv-auto').textContent = pressedText('[data-auto]');
    document.getElementById('accv-hand').textContent = pressedText('[data-hand]');
    document.getElementById('accv-bar').textContent = pressedText('[data-bar]');
    document.getElementById('accv-lang').textContent = pressedText('[data-lang]');
  }

  settingsEl.addEventListener('click', function () { renderSummaries(); });

  // ---- app feel: view transitions, sliding segmented control, number tick ----
  function enter(el, dir) {
    if (!el.animate) return;
    el.animate([
      { opacity: 0, transform: 'translateX(' + (dir * 28) + 'px)' },
      { opacity: 1, transform: 'none' }
    ], { duration: 300, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)' });
  }

  var segs = Array.prototype.slice.call(document.querySelectorAll('.mode, .pills'));
  segs.forEach(function (c) {
    var th = document.createElement('div');
    th.className = 'seg-thumb';
    c.insertBefore(th, c.firstChild);
    c._thumb = th;
    new MutationObserver(function () { syncSeg(c); }).observe(c, { attributes: true, attributeFilter: ['aria-pressed'], subtree: true });
  });

  function syncSeg(c) {
    var on = c.querySelector('[aria-pressed="true"]');
    var th = c._thumb;
    if (!on || !c.offsetWidth) return;
    if (!c._ready) {
      th.style.transition = 'none';
      c._ready = true;
    }
    th.style.width = on.offsetWidth + 'px';
    th.style.transform = 'translateX(' + on.offsetLeft + 'px)';
    if (th.style.transition === 'none') {
      void th.offsetWidth;
      th.style.transition = '';
    }
  }

  function syncSegs() {
    requestAnimationFrame(function () { segs.forEach(syncSeg); });
  }
  window.addEventListener('resize', syncSegs);

  function pulse(el) {
    el.classList.remove('tick');
    void el.offsetWidth;
    el.classList.add('tick');
  }

  // ---- auto start / stop: lay the phone flat to start, lift it to stop (accelerometer) ----
  var autoOn = false;
  var armed = false;
  var flatSince = 0;
  var liftCount = 0;
  var motionBound = false;
  try { autoOn = localStorage.getItem('putting-tempo-auto') === '1' && typeof DeviceMotionEvent !== 'undefined'; } catch (e) {}

  function needsMotionPermission() {
    return typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';
  }

  function requestMotion() {
    if (typeof DeviceMotionEvent === 'undefined') return Promise.resolve(false);
    if (needsMotionPermission()) {
      return DeviceMotionEvent.requestPermission().then(function (r) { return r === 'granted'; }, function () { return false; });
    }
    return Promise.resolve(true);
  }

  function onMotion(e) {
    var g = e.accelerationIncludingGravity;
    if (!autoOn || !g || g.z == null || document.hidden) return;
    var x = g.x || 0, y = g.y || 0, z = g.z || 0;
    var mag = Math.sqrt(x * x + y * y + z * z);
    if (mag < 1) return;
    var tilt = Math.acos(Math.min(1, Math.abs(z) / mag)) * 180 / Math.PI;   // 0 = lying flat (either face), sign-agnostic for iOS/Android
    var dev = Math.abs(mag - 9.81);
    if (running) {
      if (tilt > 20 || dev > 4) {
        liftCount += 1;
        if (liftCount >= 3) { liftCount = 0; stop(); }
      } else liftCount = 0;
      return;
    }
    if (tilt > 20) { armed = true; flatSince = 0; return; }   // picked up: next time it is put down it may start
    if (!armed || homeEl.hidden) { flatSince = 0; return; }
    if (tilt < 8 && dev < 0.9) {
      var now = performance.now();
      if (!flatSince) flatSince = now;
      else if (now - flatSince > 1000) { flatSince = 0; armed = false; start(); }
    } else flatSince = 0;
  }

  function bindMotion() {
    if (motionBound) return;
    motionBound = true;
    window.addEventListener('devicemotion', onMotion);
  }

  function renderAuto() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-auto]'), function (b) {
      b.setAttribute('aria-pressed', String((b.getAttribute('data-auto') === '1') === autoOn));
    });
    var hint = document.getElementById('autoHint');
    hint.hidden = !autoOn;
    if (autoOn) hint.textContent = t('autoHint');
  }

  function setAuto(on) {
    if (!on) {
      autoOn = false;
      armed = false;
      try { localStorage.setItem('putting-tempo-auto', '0'); } catch (e) {}
      if (!running) unlockScreen();
      renderAuto();
      return;
    }
    requestMotion().then(function (ok) {
      if (!ok) {
        autoOn = false;
        msgEl.textContent = t('autoDenied');
        renderAuto();
        return;
      }
      autoOn = true;
      armed = false;
      msgEl.textContent = '';
      try { localStorage.setItem('putting-tempo-auto', '1'); } catch (e) {}
      bindMotion();
      ensureCtx();     // unlock audio while we still have a user gesture
      lockScreen();    // keep the screen on while waiting for the phone to be put down
      renderAuto();
      renderSummaries();
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-auto]'), function (b) {
    b.addEventListener('click', function () { setAuto(b.getAttribute('data-auto') === '1'); });
  });

  function applyAuto() {
    if (autoOn) {
      if (needsMotionPermission()) {
        // iOS asks again after a restart; it needs a tap, so ask on the first touch
        document.addEventListener('pointerdown', function () {
          requestMotion().then(function (ok) { if (ok) bindMotion(); else { autoOn = false; renderAuto(); } });
        }, { once: true });
      } else bindMotion();
      lockScreen();
    }
    renderAuto();
  }

  // audio can only start after a touch: unlock it on the first one
  document.addEventListener('pointerdown', function () { ensureCtx(); }, { once: true });
  document.addEventListener('visibilitychange', function () { if (!document.hidden && (autoOn || running)) lockScreen(); });

  // ---- tabs: Practice / Tempo / Settings ----
  var runs = 0;
  var lastFacts = null;
  try { runs = parseInt(localStorage.getItem('putting-tempo-runs') || '0', 10) || 0; } catch (e) {}

  var TABS = ['home', 'measure', 'settings'];
  var tab = 'home';
  var tabbarEl = document.getElementById('tabbar');
  var tabInd = tabbarEl.querySelector('.tab-ind');
  var tabBtns = Array.prototype.slice.call(tabbarEl.querySelectorAll('.tab'));

  function updateTabbar() {
    tabBtns.forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === tab)); });
    var on = tabbarEl.querySelector('[aria-selected="true"]');
    if (on && on.offsetWidth) tabInd.style.transform = 'translateX(' + (on.offsetLeft + on.offsetWidth / 2 - 15) + 'px)';
  }

  function goTab(name) {
    if (running) stop();
    var from = TABS.indexOf(tab);
    var to = TABS.indexOf(name);
    if (name === tab && !homeEl.hidden + measureEl.hidden + settingsEl.hidden === 0) { updateTabbar(); return; }
    tab = name;
    homeEl.hidden = name !== 'home';
    measureEl.hidden = name !== 'measure';
    settingsEl.hidden = name !== 'settings';
    if (name === 'measure') {
      var T = mine || TOUR;
      setDraftTotal(T.back + T.fwd);
      renderMeasure();
    } else if (name === 'settings') {
      msgEl.textContent = '';
      renderSettings();
      renderSummaries();
    } else renderHome();
    panelEl.scrollTop = 0;
    if (to !== from) enter(name === 'home' ? homeEl : name === 'measure' ? measureEl : settingsEl, to > from ? 1 : -1);
    updateTabbar();
    syncSegs();
  }

  function showSettings(on) { goTab(on ? 'settings' : 'home'); }
  function showMeasure(on) { goTab(on ? 'measure' : 'home'); }

  tabBtns.forEach(function (b) {
    b.addEventListener('click', function () { goTab(b.getAttribute('data-tab')); });
  });
  window.addEventListener('resize', function () { requestAnimationFrame(updateTabbar); });

  // ---- touch feel: light haptic tick on Android, pop on picked cards ----
  document.addEventListener('pointerdown', function (e) {
    if (navigator.vibrate && e.target.closest && e.target.closest('button')) {
      try { navigator.vibrate(6); } catch (err) {}
    }
  });
  document.addEventListener('click', function (e) {
    var c = e.target.closest && e.target.closest('.snd');
    if (c) { c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  });

  // ---- install guidance (only outside the installed app) ----
  var deferredInstall = null;
  var installEl = document.getElementById('install');
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var forceInstall = /[?&]install=1/.test(location.search);

  function isStandalone() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  }

  function showInstall() {
    if (!forceInstall) {
      if (isStandalone()) return;
      try { if (localStorage.getItem('putting-tempo-install') === '1') return; } catch (e) {}
    }
    if (!forceInstall && (!howtoSeen() || !howtoEl.hidden)) return;
    if (!deferredInstall && !isIOS && !forceInstall) return;
    document.getElementById('installText').textContent = deferredInstall ? t('install_android') : t('install_ios');
    document.getElementById('installGo').hidden = !deferredInstall;
    installEl.hidden = false;
    if (installEl.animate) installEl.animate([{ opacity: 0, transform: 'translateY(28px) scale(0.97)' }, { opacity: 1, transform: 'none' }], { duration: 480, easing: 'cubic-bezier(0.34, 1.4, 0.64, 1)' });
  }

  function hideInstall(remember) {
    if (remember) { try { localStorage.setItem('putting-tempo-install', '1'); } catch (e) {} }
    if (!installEl.animate) { installEl.hidden = true; return; }
    installEl.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(20px)' }], { duration: 240, easing: 'ease-in' }).onfinish = function () { installEl.hidden = true; };
  }

  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredInstall = e;
    setTimeout(showInstall, 1200);
  });
  window.addEventListener('appinstalled', function () { hideInstall(true); });
  document.getElementById('installLater').addEventListener('click', function () { hideInstall(true); });
  document.getElementById('installGo').addEventListener('click', function () {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function () { deferredInstall = null; hideInstall(true); });
  });
  setTimeout(showInstall, 2800);

  // ---- how-to sheet: shown once on first launch, reopen from Settings ----
  var howtoEl = document.getElementById('howto');
  var scrimEl = document.getElementById('scrim');

  function howtoSeen() {
    try { return localStorage.getItem('putting-tempo-howto') === '1'; } catch (e) { return false; }
  }

  function showHowto() {
    scrimEl.hidden = false;
    howtoEl.hidden = false;
    if (scrimEl.animate) scrimEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, easing: 'ease-out' });
    if (howtoEl.animate) howtoEl.animate([{ opacity: 0, transform: 'translateY(32px) scale(0.97)' }, { opacity: 1, transform: 'none' }], { duration: 480, easing: 'cubic-bezier(0.34, 1.4, 0.64, 1)' });
  }

  function hideHowto() {
    try { localStorage.setItem('putting-tempo-howto', '1'); } catch (e) {}
    var done = function () { howtoEl.hidden = true; scrimEl.hidden = true; setTimeout(showInstall, 700); };
    if (!howtoEl.animate) { done(); return; }
    scrimEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220 });
    howtoEl.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(24px)' }], { duration: 220, easing: 'ease-in' }).onfinish = done;
  }

  document.getElementById('howtoGo').addEventListener('click', hideHowto);
  scrimEl.addEventListener('click', hideHowto);
  document.getElementById('howtoRow').addEventListener('click', showHowto);
  setTimeout(function () { if (!howtoSeen() && !forceInstall) showHowto(); }, 1100);

  // ---- splash: logo while fonts load ----
  (function () {
    var splash = document.getElementById('splash');
    var logoImg = document.querySelector('.logo');
    if (logoImg) splash.firstElementChild.src = logoImg.src;
    var minWait = new Promise(function (r) { setTimeout(r, 550); });
    var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    Promise.all([minWait, Promise.race([fonts, new Promise(function (r) { setTimeout(r, 2500); })])]).then(function () {
      if (!splash.animate) { splash.remove(); return; }
      splash.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: 'ease-out', fill: 'forwards' }).onfinish = function () { splash.remove(); };
    });
  })();

  function applyLang() {
    document.documentElement.lang = lang;
    document.getElementById('buyLink').href = t('buyUrl');
    document.title = t('title');
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.innerHTML = t(el.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    goBtn.textContent = running ? t('stop') : t('start');
    renderPresets();
    renderHome();
    renderSummaries();
    syncSegs();
    if (!measureEl.hidden) renderMeasure();
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('putting-tempo-lang', lang); } catch (e) {}
      applyLang();
    });
  });

  applyTempo();
  applyBar();
  applyTurn();
  applyHand();
  applyAuto();
  applyLang();
  renderSettings();
  updateTabbar();
  window.addEventListener("load", function () { updateTabbar(); });

  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.Capacitor) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
