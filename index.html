      ['자주 묻는 질문', `<p><b>시작 버튼을 눌러도 안 시작해요.</b><br>누르면 잠시 뒤 시작해요. 폰을 바닥에 놓아도 자동으로 시작해요. 소리가 안 나면 무음 모드와 볼륨을 확인하세요.</p>
<p><b>내 스트로크 시간을 재 주나요?</b><br>아니요. 박자를 보여 주는 앱이에요.</p>
<p><b>bpm이 커지면 빨라지나요?</b><br>네. bpm은 1분에 몇 번인지이고 초는 한 번에 걸리는 시간이라 반대로 움직여요.</p>
<p><b>저장하면 다른 폰에서도 보이나요?</b><br>아니요. 이 폰에만 저장돼요.</p>`]
    ],
    en: [
      ['Getting started', `<p>Lay the phone <b>flat</b> on a putting mat or the floor and keep it still for about a second. It starts by itself. <b>Lift the phone to stop.</b> You can turn auto start off in Settings.</p>
<p>To start with the phone in your hand, tap the <b>Start button</b> or anywhere on the screen. After that, lifting the phone stops it only once you have laid it flat. Tap the screen to stop while you practice.</p>
<ul><li>While the <b>bar goes down</b> is the backstroke.</li><li>At the <b>bottom</b> it turns into the forward stroke.</li><li>The moment the bar <b>reaches the top</b> is impact.</li></ul>
<p>You hear a sound <b>once when the backstroke starts and once at impact</b>. After each stroke there is a one-second rest.</p>
<p class="note">The app does not measure your stroke. It shows a rhythm to practice with, no sensors or gear needed. The screen stays on while you practice.</p>`],
      ['Choosing a tempo', `<p>The big number on the home screen is <b>bpm</b>: how many times per minute you could repeat the same stroke, from the start of the backstroke to impact. <b>60 ÷ seconds = bpm</b>.</p>
<p><b>A bigger bpm is faster, and more seconds is slower.</b> That is why the app always shows both.</p>
<table><tr><th>Name</th><th>Total</th><th>bpm</th><th>Back / Forward</th></tr>
<tr><td>Fast tempo</td><td>0.8 s</td><td>75</td><td>0.53 / 0.27 s</td></tr>
<tr><td><b>Tour Standard</b></td><td><b>0.9 s</b></td><td><b>67</b></td><td>0.60 / 0.30 s</td></tr>
<tr><td>Slow tempo</td><td>1.0 s</td><td>60</td><td>0.67 / 0.33 s</td></tr></table>
<p>Pick one on the <b>Tempo</b> tab or fine-tune it in 0.01 s steps. You can also choose the rhythm ratio (2:1 or 1.5:1). The default is 2:1.</p>
<p class="note">bpm is rounded to a whole number. Use the seconds for the exact time.</p>`],
      ['Saving your tempos', `<p>On the <b>Tempo</b> tab, set a tempo you like, type a name and tap <b>Save</b>. If you leave the name empty it is called "My tempo 1" and so on.</p>
<ul><li>You can save up to <b>5</b> tempos.</li><li>Tap an item in the list to use it right away.</li><li>Tap <b>Delete</b> to remove one. When all 5 are used, delete one to save a new one.</li></ul>
<p class="note">Saved tempos stay <b>on this phone only</b>. They are lost if you delete the app or its data, and they do not move to another phone or between the web version and the app.</p>`],
      ['Sound and cue settings', `<p>Change these in the <b>Settings</b> tab.</p>
<ul><li><b>Sound</b>: choose from 15. Tap one to hear the start sound and the impact sound.</li>
<li><b>Transition cue</b>: marks the moment the backstroke ends and the forward stroke begins. Choose Off, Screen flash (default), Bottom glow, Bar flash or Ripple.</li>
<li><b>Auto start</b>: starts when you lay the phone down and stops when you lift it.</li>
<li>You can also change the <b>bar thickness</b> and the <b>language</b> (한국어, 日本語, 简体中文, English, Español, Deutsch, Français, Svenska, Italiano).</li></ul>
<p class="note">No sound? Check the silent mode and the volume. On iPhone you may be asked to allow motion access the first time.</p>`],
      ['How to practice', `<p>These are <b>suggestions</b> based on research and how the app works. They are not a proven prescription.</p>
<ul><li><b>Start with Tour Standard (0.9 s).</b></li>
<li>Change it <b>one step (0.1 s) at a time</b>. Big jumps are hard to compare.</li>
<li>Put <b>comfort first</b>. A faster or slower tempo is not better by itself. The goal is a beat you can repeat every time.</li>
<li>Keep the <b>time the same</b> for different distances and change the <b>size of the stroke</b> instead.</li>
<li>Practice in <b>short sets</b>, for example 3 sets of 10 with 1 to 2 minutes of rest.</li>
<li>Use it to warm up before a round, then putt on the course without the app.</li>
<li>Tempo alone will not fix your putting. Watch <b>where the ball goes</b> and how far.</li></ul>`],
      ['What is the tempo based on?', `<p>The default of 0.9 s comes from studies that measured skilled golfers: the time from the start of the backstroke to impact was roughly <b>0.86 to 0.99 s</b>, and backstroke to forward stroke was about <b>2:1</b>.</p>
<table><tr><th>Study</th><th>Players</th><th>Start to impact</th></tr>
<tr><td>Marquardt (2007)</td><td>99 tour players</td><td>about 0.99 s on average, ratio about 2.1</td></tr>
<tr><td>Couceiro et al. (2022)</td><td>10 skilled men</td><td>about 0.86 to 0.90 s</td></tr></table>
<p><b>Good to know</b></p>
<ul><li><b>There is no single right tempo.</b> Even in the same study, players differed in speed. What they shared was keeping their own tempo steady.</li>
<li>No experiment shows that this tempo raises your success rate. This app is <b>a tool for practicing a steady tempo</b>.</li>
<li>Numbers in books or videos may differ from this app. If the measured part of the stroke is different, the same number means a different tempo.</li></ul>`],
      ['FAQ', `<p><b>I tapped Start but nothing started.</b><br>It starts after a moment. It also starts by itself when you lay the phone down. If you hear nothing, check silent mode and volume.</p>
<p><b>Does it measure my stroke time?</b><br>No. It only shows a rhythm.</p>
<p><b>Does a bigger bpm mean faster?</b><br>Yes. bpm is how many per minute and seconds is how long one takes, so they move in opposite directions.</p>
<p><b>Do my saved tempos show on another phone?</b><br>No. They are stored on this phone only.</p>`]
    ],
    ja: [
      ['はじめに', `<p>パッティングマットや床にスマホを<b>平らに</b>置き、1秒ほど動かさないでください。自動で始まります。スマホを<b>持ち上げると止まります</b>。自動スタートは設定でオフにできます。</p>
<p>手に持ったまま始めるときは<b>スタートボタン</b>か画面のどこかをタップします。その場合は、一度スマホを平らに置いたあとで持ち上げると止まります。練習中に画面をタップしても止まります。</p>
<ul><li><b>バーが下がる間</b>がバックスイングです。</li><li><b>一番下</b>でダウンに切り替わります。</li><li><b>バーが上に戻って頂点に着く瞬間</b>がインパクトです。</li></ul>
<p>音は<b>バックスイングの始まりに1回、インパクトに1回</b>鳴ります。1ストロークが終わると1秒休んでまた始まります。</p>
<p class="note">このアプリはストロークを測りません。センサーや道具なしで、リズムを見せる練習用ガイドです。練習中は画面が消えません。</p>`],
      ['テンポの選び方', `<p>ホーム画面の大きな数字は<b>bpm</b>です。バックスイング開始からインパクトまでの同じストロークを1分間に何回できる速さか、という意味です。<b>60 ÷ 秒 = bpm</b>です。</p>
<p><b>bpmが大きいほど速く、秒が大きいほど遅い</b>です。そのため画面には両方を表示します。</p>
<table><tr><th>名前</th><th>合計</th><th>bpm</th><th>バック / ダウン</th></tr>
<tr><td>速いテンポ</td><td>0.8秒</td><td>75</td><td>0.53 / 0.27秒</td></tr>
<tr><td><b>標準テンポ</b></td><td><b>0.9秒</b></td><td><b>67</b></td><td>0.60 / 0.30秒</td></tr>
<tr><td>ゆったりテンポ</td><td>1.0秒</td><td>60</td><td>0.67 / 0.33秒</td></tr></table>
<p><b>テンポ</b>タブで選ぶか、0.01秒ずつ微調整できます。リズム比(2:1か1.5:1)も選べます。初期値は2:1です。</p>
<p class="note">bpmは四捨五入した値です。正確な時間は秒で確認してください。</p>`],
      ['自分のテンポを保存', `<p><b>テンポ</b>タブで好みのテンポを作り、名前を入れて<b>保存</b>を押します。名前が空のときは「自分のテンポ 1」のように自動で付きます。</p>
<ul><li>最大<b>5件</b>まで保存できます。</li><li>リストの項目をタップするとすぐに使えます。</li><li><b>削除</b>で消せます。5件使っているときは1つ削除してから保存してください。</li></ul>
<p class="note">保存したテンポは<b>このスマホの中だけ</b>にあります。アプリやデータを消すとなくなり、別のスマホやWeb版とアプリの間では移りません。</p>`],
      ['音と表示の設定', `<p><b>設定</b>タブで変更できます。</p>
<ul><li><b>サウンド</b>: 15種類から選びます。タップすると開始音とインパクト音を続けて聞けます。</li>
<li><b>切り替え表示</b>: バックスイングが終わってダウンに切り替わる瞬間を知らせます。なし、画面点滅(初期値)、下部、バー点滅、波紋から選べます。</li>
<li><b>自動スタート</b>: 置くと始まり、持ち上げると止まります。</li>
<li><b>バーの太さ</b>と<b>言語</b>(한국어・日本語・简体中文・English・Español・Deutsch・Français・Svenska・Italiano)も変えられます。</li></ul>
<p class="note">音が出ないときはマナーモードと音量を確認してください。iPhoneでは初回にモーションの許可を求められることがあります。</p>`],
      ['練習のしかた', `<p>研究結果とアプリの仕組みに基づく<b>おすすめの使い方</b>です。効果が証明された処方ではありません。</p>
<ul><li><b>最初は標準テンポ(0.9秒)</b>から始めます。</li>
<li>変えるときは<b>1段階(0.1秒)ずつ</b>にします。大きく変えると比べにくくなります。</li>
<li><b>心地よいテンポ</b>を優先します。速い・遅いに正解はなく、毎回同じ拍で打てることが目標です。</li>
<li>距離が違っても<b>時間は同じ</b>にして、距離は<b>ストロークの大きさ</b>で調整してみましょう。</li>
<li>10回×3セットなど<b>短く区切り</b>、間に1〜2分休みます。</li>
<li>ラウンド前のウォームアップに使い、コースではアプリなしでその感覚で打ちます。</li>
<li>テンポだけでパッティングは良くなりません。<b>ボールの方向と距離</b>も見てください。</li></ul>`],
      ['テンポの根拠', `<p>初期値の0.9秒は、上級ゴルファーを計測した研究で、開始からインパクトまでがおよそ<b>0.86〜0.99秒</b>、バックスイングとダウンの比が<b>約2:1</b>だったことを基にしています。</p>
<table><tr><th>研究</th><th>対象</th><th>開始→インパクト</th></tr>
<tr><td>Marquardt (2007)</td><td>ツアー選手99人</td><td>平均 約0.99秒、比 約2.1</td></tr>
<tr><td>Couceiro ほか (2022)</td><td>上級男性10人</td><td>約0.86〜0.90秒</td></tr></table>
<p><b>知っておいてください</b></p>
<ul><li><b>正解のテンポは1つではありません。</b>同じ研究でも選手ごとに速さが違い、共通点は自分のテンポを一定に保つことでした。</li>
<li>このテンポで打てば成功率が上がる、という実験結果はありません。このアプリは<b>一定のテンポで練習するための道具</b>です。</li>
<li>本や動画のbpmと数字が違うことがあります。測る区間が違うと、同じ数字でも別のテンポです。</li></ul>`],
      ['よくある質問', `<p><b>スタートを押しても始まりません。</b><br>押して少しすると始まります。スマホを置いても自動で始まります。音が出ないときはマナーモードと音量を確認してください。</p>
<p><b>ストロークの時間を測ってくれますか?</b><br>いいえ。リズムを見せるアプリです。</p>
<p><b>bpmが大きいと速くなりますか?</b><br>はい。bpmは1分間の回数、秒は1回にかかる時間なので、反対に動きます。</p>
<p><b>保存したテンポは別のスマホでも見えますか?</b><br>いいえ。このスマホにだけ保存されます。</p>`]
    ],
    zh: [
      ["开始使用", `<p>将手机<b>平放</b>在推杆垫或地面上，保持不动约一秒，就会自动开始。<b>拿起手机即可停止。</b>可在设置中关闭自动开始。</p>
<p>如果想拿在手里开始，请点击<b>开始按钮</b>或屏幕任意位置。之后，只有把手机平放过，拿起手机才会停止。练习时也可以点击屏幕停止。</p>
<ul><li><b>光条下移</b>的过程是上杆。</li><li>到<b>底部</b>时转为推杆。</li><li>光条<b>到达顶端</b>的瞬间就是击球。</li></ul>
<p>你会听到声音：<b>上杆开始时一次，击球时一次</b>。每次挥杆后有一秒的休息。</p>
<p class="note">应用不会测量你的挥杆，只是提供一个可以跟着练习的节奏，无需传感器或其他装备。练习时屏幕会保持常亮。</p>`],
      ["选择节奏", `<p>主屏幕上的大数字是 <b>bpm</b>：同一个挥杆（从上杆开始到击球）每分钟可以重复多少次。<b>60 ÷ 秒数 = bpm</b>。</p>
<p><b>bpm 越大越快，秒数越多越慢。</b>所以应用会同时显示两者。</p>
<table><tr><th>名称</th><th>总时长</th><th>bpm</th><th>上杆 / 推杆</th></tr>
<tr><td>快节奏</td><td>0.8 秒</td><td>75</td><td>0.53 / 0.27 秒</td></tr>
<tr><td><b>标准节奏</b></td><td><b>0.9 秒</b></td><td><b>67</b></td><td>0.60 / 0.30 秒</td></tr>
<tr><td>慢节奏</td><td>1.0 秒</td><td>60</td><td>0.67 / 0.33 秒</td></tr></table>
<p>可在<b>节奏</b>页选择，或以 0.01 秒为单位微调。也可以选择节奏比例（2:1 或 1.5:1），默认是 2:1。</p>
<p class="note">bpm 已四舍五入为整数。需要精确时间请看秒数。</p>`],
      ["保存你的节奏", `<p>在<b>节奏</b>页设置好喜欢的节奏，输入名称并点击<b>保存</b>。名称留空的话，会依次叫作“我的节奏 1”等。</p>
<ul><li>最多可保存 <b>5</b> 个节奏。</li><li>点击列表中的项目即可立即使用。</li><li>点击<b>删除</b>可移除。5 个都用完后，请先删除一个再保存新的。</li></ul>
<p class="note">已保存的节奏<b>只存在这部手机里</b>。删除应用或其数据后会丢失，也不会同步到其他手机，网页版和应用之间也不互通。</p>`],
      ["声音与提示设置", `<p>在<b>设置</b>页中更改。</p>
<ul><li><b>声音</b>：共 15 种可选。点击一种即可听到开始音和击球音。</li>
<li><b>转换提示</b>：标记上杆结束、推杆开始的瞬间。可选关、屏幕闪烁（默认）、底部光晕、光条闪烁或涟漪。</li>
<li><b>自动开始</b>：放下手机时开始，拿起时停止。</li>
<li>还可以更改<b>光条粗细</b>和<b>语言</b>（한국어、日本語、简体中文、English、Español、Deutsch、Français、Svenska、Italiano）。</li></ul>
<p class="note">没有声音？请检查静音模式和音量。在 iPhone 上，首次使用时可能会请求允许访问动作传感器。</p>`],
      ["练习建议", `<p>以下只是根据研究和应用特点给出的<b>建议</b>，并非经过验证的处方。</p>
<ul><li><b>先从标准节奏（0.9 秒）开始。</b></li>
<li>每次只调<b>一档（0.1 秒）</b>。幅度太大不好比较。</li>
<li><b>舒适优先</b>。更快或更慢本身并不更好，目标是每次都能重复的节拍。</li>
<li>不同距离保持<b>时间不变</b>，改变<b>挥杆幅度</b>。</li>
<li>分<b>小组</b>练习，例如 3 组、每组 10 次，组间休息 1 到 2 分钟。</li>
<li>可在上场前热身时使用，到球场上就不用应用了。</li>
<li>只靠节奏并不能解决推杆问题。还要留意<b>球去了哪里</b>以及滚了多远。</li></ul>`],
      ["节奏的依据是什么？", `<p>默认的 0.9 秒来自对熟练球手的测量研究：从上杆开始到击球大约是 <b>0.86 到 0.99 秒</b>，上杆与推杆之比约为 <b>2:1</b>。</p>
<table><tr><th>研究</th><th>球手</th><th>从开始到击球</th></tr>
<tr><td>Marquardt (2007)</td><td>99 名巡回赛球手</td><td>平均约 0.99 秒，比例约 2.1</td></tr>
<tr><td>Couceiro et al. (2022)</td><td>10 名熟练男性球手</td><td>约 0.86 到 0.90 秒</td></tr></table>
<p><b>须知</b></p>
<ul><li><b>没有唯一正确的节奏。</b>即使在同一项研究中，球手的速度也各不相同。他们的共同点是保持自己的节奏稳定。</li>
<li>没有任何实验表明这个节奏能提高成功率。这款应用只是<b>练习稳定节奏的工具</b>。</li>
<li>书籍或视频中的数字可能与本应用不同。如果测量的挥杆区间不一样，同样的数字代表的节奏也不同。</li></ul>`],
      ["常见问题", `<p><b>我点了开始，但没有反应。</b><br>稍等片刻就会开始。把手机平放时也会自动开始。如果没有声音，请检查静音模式和音量。</p>
<p><b>它会测量我的挥杆时间吗？</b><br>不会，它只是显示一个节奏。</p>
<p><b>bpm 越大就越快吗？</b><br>是的。bpm 是每分钟的次数，秒数是一次所需的时间，所以两者方向相反。</p>
<p><b>我保存的节奏会在另一部手机上显示吗？</b><br>不会，它们只保存在这部手机上。</p>`]
    ],
    es: [
      ["Primeros pasos", `<p>Coloca el móvil <b>plano</b> sobre una alfombrilla de putt o en el suelo y mantenlo quieto aproximadamente un segundo. Empieza solo. <b>Levanta el móvil para parar.</b> Puedes desactivar el inicio automático en Ajustes.</p>
<p>Para empezar con el móvil en la mano, toca el <b>botón Iniciar</b> o cualquier parte de la pantalla. Después, levantar el móvil solo lo detiene una vez que lo hayas dejado plano. Toca la pantalla para parar mientras practicas.</p>
<ul><li>Mientras la <b>barra baja</b> es el backswing.</li><li>Abajo <b>cambia</b> al swing hacia adelante.</li><li>El momento en que la barra <b>llega arriba</b> es el impacto.</li></ul>
<p>Oyes un sonido <b>una vez al empezar el backswing y otra en el impacto</b>. Después de cada golpe hay un descanso de un segundo.</p>
<p class="note">La app no mide tu golpe. Muestra un ritmo para practicar, sin sensores ni accesorios. La pantalla se mantiene encendida mientras practicas.</p>`],
      ["Elegir un tempo", `<p>El número grande de la pantalla de inicio son los <b>bpm</b>: cuántas veces por minuto podrías repetir el mismo golpe, desde el inicio del backswing hasta el impacto. <b>60 ÷ segundos = bpm</b>.</p>
<p><b>Más bpm es más rápido, y más segundos es más lento.</b> Por eso la app siempre muestra ambos.</p>
<table><tr><th>Nombre</th><th>Total</th><th>bpm</th><th>Atrás / Avance</th></tr>
<tr><td>Tempo rápido</td><td>0.8 s</td><td>75</td><td>0.53 / 0.27 s</td></tr>
<tr><td><b>Tempo estándar</b></td><td><b>0.9 s</b></td><td><b>67</b></td><td>0.60 / 0.30 s</td></tr>
<tr><td>Tempo lento</td><td>1.0 s</td><td>60</td><td>0.67 / 0.33 s</td></tr></table>
<p>Elige uno en la pestaña <b>Tempo</b> o ajústalo de 0,01 s en 0,01 s. También puedes elegir la proporción del ritmo (2:1 o 1.5:1). Por defecto es 2:1.</p>
<p class="note">Los bpm se redondean a un número entero. Usa los segundos para el tiempo exacto.</p>`],
      ["Guardar tus tempos", `<p>En la pestaña <b>Tempo</b>, ajusta un tempo que te guste, escribe un nombre y toca <b>Guardar</b>. Si dejas el nombre vacío se llamará "Mi tempo 1" y así sucesivamente.</p>
<ul><li>Puedes guardar hasta <b>5</b> tempos.</li><li>Toca un elemento de la lista para usarlo al instante.</li><li>Toca <b>Borrar</b> para eliminar uno. Cuando los 5 estén ocupados, borra uno para guardar uno nuevo.</li></ul>
<p class="note">Los tempos guardados se quedan <b>solo en este móvil</b>. Se pierden si borras la app o sus datos, y no pasan a otro móvil ni entre la versión web y la app.</p>`],
      ["Ajustes de sonido y señales", `<p>Cámbialos en la pestaña <b>Ajustes</b>.</p>
<ul><li><b>Sonido</b>: elige entre 15. Toca uno para oír el sonido de inicio y el de impacto.</li>
<li><b>Señal de cambio</b>: marca el momento en que termina el backswing y empieza el swing hacia adelante. Elige No, Destello pantalla (por defecto), Brillo inferior, Destello barra u Onda.</li>
<li><b>Inicio automático</b>: empieza al dejar el móvil plano y se detiene al levantarlo.</li>
<li>También puedes cambiar el <b>grosor de la barra</b> y el <b>idioma</b> (한국어, 日本語, 简体中文, English, Español, Deutsch, Français, Svenska, Italiano).</li></ul>
<p class="note">¿No hay sonido? Revisa el modo silencio y el volumen. En iPhone, la primera vez puede pedirte permiso de acceso al movimiento.</p>`],
      ["Cómo practicar", `<p>Son <b>sugerencias</b> basadas en estudios y en cómo funciona la app. No son una receta probada.</p>
<ul><li><b>Empieza con el tempo estándar (0.9 s).</b></li>
<li>Cámbialo <b>un paso (0,1 s) cada vez</b>. Los saltos grandes son difíciles de comparar.</li>
<li>Pon la <b>comodidad primero</b>. Un tempo más rápido o más lento no es mejor por sí mismo. El objetivo es un ritmo que puedas repetir siempre.</li>
<li>Mantén el <b>mismo tiempo</b> para distintas distancias y cambia el <b>tamaño del golpe</b>.</li>
<li>Practica en <b>series cortas</b>, por ejemplo 3 series de 10 con 1 o 2 minutos de descanso.</li>
<li>Úsala para calentar antes de la ronda y luego puttea en el campo sin la app.</li>
<li>El tempo por sí solo no arregla tu putt. Fíjate en <b>hacia dónde va la bola</b> y a qué distancia.</li></ul>`],
      ["¿En qué se basa el tempo?", `<p>El valor por defecto de 0.9 s viene de estudios que midieron a golfistas con buen nivel: el tiempo desde el inicio del backswing hasta el impacto fue de aproximadamente <b>0.86 a 0.99 s</b>, y la relación entre backswing y swing hacia adelante fue de cerca de <b>2:1</b>.</p>
<table><tr><th>Estudio</th><th>Jugadores</th><th>Del inicio al impacto</th></tr>
<tr><td>Marquardt (2007)</td><td>99 jugadores de tour</td><td>unos 0.99 s de media, proporción de unos 2.1</td></tr>
<tr><td>Couceiro et al. (2022)</td><td>10 hombres con buen nivel</td><td>unos 0.86 a 0.90 s</td></tr></table>
<p><b>Conviene saber</b></p>
<ul><li><b>No hay un único tempo correcto.</b> Incluso en el mismo estudio, los jugadores diferían en velocidad. Lo que compartían era mantener estable su propio tempo.</li>
<li>Ningún experimento demuestra que este tempo aumente tu porcentaje de éxito. Esta app es <b>una herramienta para practicar un tempo constante</b>.</li>
<li>Los números de libros o vídeos pueden diferir de los de esta app. Si la parte medida del golpe es distinta, el mismo número significa un tempo diferente.</li></ul>`],
      ["Preguntas frecuentes", `<p><b>Toqué Iniciar pero no empezó nada.</b><br>Empieza tras un momento. También empieza solo al dejar el móvil plano. Si no oyes nada, revisa el modo silencio y el volumen.</p>
<p><b>¿Mide el tiempo de mi golpe?</b><br>No. Solo muestra un ritmo.</p>
<p><b>¿Más bpm significa más rápido?</b><br>Sí. Los bpm son cuántos por minuto y los segundos son lo que dura uno, así que van en sentido contrario.</p>
<p><b>¿Mis tempos guardados aparecen en otro móvil?</b><br>No. Se guardan solo en este móvil.</p>`]
    ],
    de: [
      ["Erste Schritte", `<p>Leg das Handy <b>flach</b> auf eine Puttingmatte oder den Boden und halte es etwa eine Sekunde ruhig. Es startet von selbst. <b>Heb das Handy an, um zu stoppen.</b> Den Autostart kannst du in den Einstellungen ausschalten.</p>
<p>Wenn du mit dem Handy in der Hand starten willst, tippe auf den <b>Start-Button</b> oder irgendwo auf den Bildschirm. Danach stoppt das Anheben das Handy erst, nachdem du es flach hingelegt hast. Tippe beim Üben auf den Bildschirm, um zu stoppen.</p>
<ul><li>Solange der <b>Balken nach unten geht</b>, ist es der Rückschwung.</li><li><b>Unten</b> wechselt er in den Durchschwung.</li><li>Der Moment, in dem der Balken <b>oben ankommt</b>, ist der Treffmoment.</li></ul>
<p>Du hörst einen Ton <b>einmal beim Start des Rückschwungs und einmal beim Treffmoment</b>. Nach jedem Schlag gibt es eine Sekunde Pause.</p>
<p class="note">Die App misst deinen Schlag nicht. Sie zeigt dir einen Rhythmus zum Üben, ganz ohne Sensoren oder Zubehör. Der Bildschirm bleibt beim Üben an.</p>`],
      ["Ein Tempo wählen", `<p>Die große Zahl auf dem Startbildschirm ist <b>bpm</b>: wie oft pro Minute du denselben Schlag wiederholen könntest, vom Start des Rückschwungs bis zum Treffmoment. <b>60 ÷ Sekunden = bpm</b>.</p>
<p><b>Mehr bpm heißt schneller, mehr Sekunden heißt langsamer.</b> Deshalb zeigt die App immer beides an.</p>
<table><tr><th>Name</th><th>Gesamt</th><th>bpm</th><th>Rück / Durch</th></tr>
<tr><td>Schnelles Tempo</td><td>0,8 s</td><td>75</td><td>0,53 / 0,27 s</td></tr>
<tr><td><b>Standard-Tempo</b></td><td><b>0,9 s</b></td><td><b>67</b></td><td>0,60 / 0,30 s</td></tr>
<tr><td>Langsames Tempo</td><td>1,0 s</td><td>60</td><td>0,67 / 0,33 s</td></tr></table>
<p>Wähle eines im Tab <b>Tempo</b> oder stimme es in 0,01-s-Schritten fein ab. Du kannst auch das Rhythmusverhältnis wählen (2:1 oder 1,5:1). Voreingestellt ist 2:1.</p>
<p class="note">bpm wird auf eine ganze Zahl gerundet. Die genaue Zeit steht in den Sekunden.</p>`],
      ["Tempos speichern", `<p>Stelle im Tab <b>Tempo</b> ein Tempo ein, das dir gefällt, gib einen Namen ein und tippe auf <b>Speichern</b>. Ohne Namen heißt es „Mein Tempo 1“ und so weiter.</p>
<ul><li>Du kannst bis zu <b>5</b> Tempos speichern.</li><li>Tippe auf einen Eintrag in der Liste, um ihn sofort zu nutzen.</li><li>Tippe auf <b>Löschen</b>, um einen zu entfernen. Sind alle 5 belegt, lösche eins, um ein neues zu speichern.</li></ul>
<p class="note">Gespeicherte Tempos bleiben <b>nur auf diesem Handy</b>. Sie gehen verloren, wenn du die App oder ihre Daten löschst, und sie wechseln weder auf ein anderes Handy noch zwischen Webversion und App.</p>`],
      ["Sound- und Signal-Einstellungen", `<p>Ändere sie im Tab <b>Einstellungen</b>.</p>
<ul><li><b>Sound</b>: Wähle aus 15. Tippe auf einen, um den Startton und den Treffton zu hören.</li>
<li><b>Wechsel-Signal</b>: markiert den Moment, in dem der Rückschwung endet und der Durchschwung beginnt. Wähle Aus, Bildschirm-Blitz (Standard), Unten leuchten, Balken-Blitz oder Welle.</li>
<li><b>Autostart</b>: startet, wenn du das Handy hinlegst, und stoppt, wenn du es anhebst.</li>
<li>Du kannst auch die <b>Balkendicke</b> und die <b>Sprache</b> ändern (한국어, 日本語, 简体中文, English, Español, Deutsch, Français, Svenska, Italiano).</li></ul>
<p class="note">Kein Ton? Prüfe den Stummmodus und die Lautstärke. Auf dem iPhone wirst du beim ersten Mal eventuell gebeten, den Zugriff auf Bewegungssensoren zu erlauben.</p>`],
      ["So übst du", `<p>Das sind <b>Vorschläge</b>, die auf Forschung und der Funktionsweise der App beruhen. Sie sind kein bewährtes Rezept.</p>
<ul><li><b>Beginne mit dem Standard-Tempo (0,9 s).</b></li>
<li>Ändere es <b>immer nur einen Schritt (0,1 s)</b>. Große Sprünge lassen sich schwer vergleichen.</li>
<li>Stelle <b>Wohlbefinden an erste Stelle</b>. Ein schnelleres oder langsameres Tempo ist nicht von sich aus besser. Das Ziel ist ein Takt, den du jedes Mal wiederholen kannst.</li>
<li>Behalte die <b>Zeit gleich</b> bei verschiedenen Distanzen und ändere stattdessen die <b>Länge des Schwungs</b>.</li>
<li>Übe in <b>kurzen Serien</b>, zum Beispiel 3 Serien à 10 mit 1 bis 2 Minuten Pause.</li>
<li>Nutze es zum Aufwärmen vor der Runde und putte dann auf dem Platz ohne die App.</li>
<li>Das Tempo allein löst dein Putting nicht. Achte darauf, <b>wohin der Ball rollt</b> und wie weit.</li></ul>`],
      ["Worauf basiert das Tempo?", `<p>Die Voreinstellung von 0,9 s stammt aus Studien, in denen geübte Golfer gemessen wurden: Die Zeit vom Start des Rückschwungs bis zum Treffmoment lag bei etwa <b>0,86 bis 0,99 s</b>, und Rückschwung zu Durchschwung verhielt sich etwa wie <b>2:1</b>.</p>
<table><tr><th>Studie</th><th>Spieler</th><th>Start bis Treffmoment</th></tr>
<tr><td>Marquardt (2007)</td><td>99 Tourspieler</td><td>im Schnitt etwa 0,99 s, Verhältnis etwa 2,1</td></tr>
<tr><td>Couceiro et al. (2022)</td><td>10 geübte Männer</td><td>etwa 0,86 bis 0,90 s</td></tr></table>
<p><b>Gut zu wissen</b></p>
<ul><li><b>Es gibt kein einzig richtiges Tempo.</b> Selbst innerhalb einer Studie unterschieden sich die Spieler in der Geschwindigkeit. Gemeinsam war ihnen, ihr eigenes Tempo gleichmäßig zu halten.</li>
<li>Kein Experiment zeigt, dass dieses Tempo deine Erfolgsquote erhöht. Diese App ist <b>ein Werkzeug, um ein gleichmäßiges Tempo zu üben</b>.</li>
<li>Zahlen in Büchern oder Videos können von dieser App abweichen. Wird ein anderer Teil des Schlags gemessen, bedeutet dieselbe Zahl ein anderes Tempo.</li></ul>`],
      ["FAQ", `<p><b>Ich habe auf Start getippt, aber nichts passiert.</b><br>Es startet nach einem Moment. Es startet auch von selbst, wenn du das Handy hinlegst. Hörst du nichts, prüfe Stummmodus und Lautstärke.</p>
<p><b>Misst die App meine Schlagzeit?</b><br>Nein. Sie zeigt nur einen Rhythmus.</p>
<p><b>Heißt mehr bpm schneller?</b><br>Ja. bpm ist die Anzahl pro Minute und die Sekunden sind die Dauer eines Schlags, also gehen sie in entgegengesetzte Richtungen.</p>
<p><b>Erscheinen meine gespeicherten Tempos auf einem anderen Handy?</b><br>Nein. Sie sind nur auf diesem Handy gespeichert.</p>`]
    ],
    fr: [
      ["Pour commencer", `<p>Pose le téléphone <b>à plat</b> sur un tapis de putting ou par terre et ne bouge plus pendant environ une seconde. Il démarre tout seul. <b>Soulève le téléphone pour arrêter.</b> Tu peux désactiver le démarrage auto dans les réglages.</p>
<p>Pour démarrer avec le téléphone en main, touche le <b>bouton Démarrer</b> ou n'importe où sur l'écran. Ensuite, soulever le téléphone ne l'arrête qu'après l'avoir posé à plat. Touche l'écran pour arrêter pendant ton entraînement.</p>
<ul><li>Quand la <b>barre descend</b>, c'est le mouvement arrière.</li><li>En <b>bas</b>, elle passe au mouvement avant.</li><li>Le moment où la barre <b>arrive en haut</b> est l'impact.</li></ul>
<p>Tu entends un son <b>une fois au début du mouvement arrière et une fois à l'impact</b>. Après chaque coup, il y a une pause d'une seconde.</p>
<p class="note">L'appli ne mesure pas ton coup. Elle te donne un rythme pour t'entraîner, sans capteur ni accessoire. L'écran reste allumé pendant l'entraînement.</p>`],
      ["Choisir un tempo", `<p>Le grand nombre de l'écran d'accueil est le <b>bpm</b> : combien de fois par minute tu pourrais répéter le même coup, du début du mouvement arrière à l'impact. <b>60 ÷ secondes = bpm</b>.</p>
<p><b>Un bpm plus élevé est plus rapide, et plus de secondes est plus lent.</b> C'est pourquoi l'appli affiche toujours les deux.</p>
<table><tr><th>Nom</th><th>Total</th><th>bpm</th><th>Arrière / Avant</th></tr>
<tr><td>Tempo rapide</td><td>0,8 s</td><td>75</td><td>0,53 / 0,27 s</td></tr>
<tr><td><b>Tempo standard</b></td><td><b>0,9 s</b></td><td><b>67</b></td><td>0,60 / 0,30 s</td></tr>
<tr><td>Tempo lent</td><td>1,0 s</td><td>60</td><td>0,67 / 0,33 s</td></tr></table>
<p>Choisis-en un dans l'onglet <b>Tempo</b> ou ajuste-le par pas de 0,01 s. Tu peux aussi choisir le ratio du rythme (2:1 ou 1,5:1). Par défaut, c'est 2:1.</p>
<p class="note">Le bpm est arrondi à l'entier. Utilise les secondes pour le temps exact.</p>`],
      ["Enregistrer tes tempos", `<p>Dans l'onglet <b>Tempo</b>, règle un tempo qui te plaît, saisis un nom et touche <b>Enregistrer</b>. Si tu laisses le nom vide, il s'appellera « Mon tempo 1 », etc.</p>
<ul><li>Tu peux enregistrer jusqu'à <b>5</b> tempos.</li><li>Touche un élément de la liste pour l'utiliser tout de suite.</li><li>Touche <b>Supprimer</b> pour en retirer un. Quand les 5 sont utilisés, supprime-en un pour en enregistrer un nouveau.</li></ul>
<p class="note">Les tempos enregistrés restent <b>sur ce téléphone uniquement</b>. Ils sont perdus si tu supprimes l'appli ou ses données, et ils ne passent pas sur un autre téléphone ni entre la version web et l'appli.</p>`],
      ["Réglages du son et du signal", `<p>Modifie-les dans l'onglet <b>Réglages</b>.</p>
<ul><li><b>Son</b> : choisis parmi 15. Touche-en un pour entendre le son de départ et celui de l'impact.</li>
<li><b>Signal de transition</b> : marque le moment où le mouvement arrière se termine et où le mouvement avant commence. Choisis Aucun, Éclair écran (par défaut), Lueur bas, Éclair barre ou Onde.</li>
<li><b>Démarrage auto</b> : démarre quand tu poses le téléphone et s'arrête quand tu le soulèves.</li>
<li>Tu peux aussi changer l'<b>épaisseur de la barre</b> et la <b>langue</b> (한국어, 日本語, 简体中文, English, Español, Deutsch, Français, Svenska, Italiano).</li></ul>
<p class="note">Pas de son ? Vérifie le mode silencieux et le volume. Sur iPhone, l'accès au mouvement peut t'être demandé la première fois.</p>`],
      ["Comment s'entraîner", `<p>Ce sont des <b>suggestions</b> fondées sur des études et sur le fonctionnement de l'appli. Ce n'est pas une méthode prouvée.</p>
<ul><li><b>Commence avec le tempo standard (0,9 s).</b></li>
<li>Change-le <b>d'un cran (0,1 s) à la fois</b>. Les grands écarts sont difficiles à comparer.</li>
<li>Mets le <b>confort en premier</b>. Un tempo plus rapide ou plus lent n'est pas meilleur en soi. Le but est un rythme que tu peux reproduire à chaque fois.</li>
<li>Garde le <b>même temps</b> pour différentes distances et change plutôt l'<b>amplitude du mouvement</b>.</li>
<li>Entraîne-toi par <b>petites séries</b>, par exemple 3 séries de 10 avec 1 à 2 minutes de repos.</li>
<li>Utilise-la pour t'échauffer avant une partie, puis putte sur le parcours sans l'appli.</li>
<li>Le tempo seul ne règlera pas ton putting. Regarde <b>où va la balle</b> et jusqu'où.</li></ul>`],
      ["Sur quoi repose le tempo ?", `<p>Le tempo par défaut de 0,9 s vient d'études qui ont mesuré des golfeurs expérimentés : le temps entre le début du mouvement arrière et l'impact était d'environ <b>0,86 à 0,99 s</b>, et le rapport mouvement arrière / mouvement avant d'environ <b>2:1</b>.</p>
<table><tr><th>Étude</th><th>Joueurs</th><th>Du départ à l'impact</th></tr>
<tr><td>Marquardt (2007)</td><td>99 joueurs du circuit</td><td>environ 0,99 s en moyenne, ratio d'environ 2,1</td></tr>
<tr><td>Couceiro et al. (2022)</td><td>10 hommes expérimentés</td><td>environ 0,86 à 0,90 s</td></tr></table>
<p><b>Bon à savoir</b></p>
<ul><li><b>Il n'existe pas un seul bon tempo.</b> Même dans une même étude, la vitesse variait selon les joueurs. Ce qu'ils avaient en commun, c'était de garder leur propre tempo régulier.</li>
<li>Aucune expérience ne montre que ce tempo augmente ton taux de réussite. Cette appli est <b>un outil pour s'entraîner à un tempo régulier</b>.</li>
<li>Les chiffres vus dans des livres ou des vidéos peuvent différer de ceux de cette appli. Si la partie mesurée du mouvement n'est pas la même, un même chiffre correspond à un tempo différent.</li></ul>`],
      ["FAQ", `<p><b>J'ai touché Démarrer mais rien ne se passe.</b><br>Il démarre après un court instant. Il démarre aussi tout seul quand tu poses le téléphone. Si tu n'entends rien, vérifie le mode silencieux et le volume.</p>
<p><b>Est-ce que ça mesure la durée de mon coup ?</b><br>Non. L'appli ne fait que montrer un rythme.</p>
<p><b>Un bpm plus élevé veut-il dire plus rapide ?</b><br>Oui. Le bpm est le nombre de répétitions par minute et les secondes sont la durée d'un coup : les deux vont en sens opposés.</p>
<p><b>Mes tempos enregistrés s'affichent-ils sur un autre téléphone ?</b><br>Non. Ils sont stockés uniquement sur ce téléphone.</p>`]
    ],
    sv: [
      ["Kom igång", `<p>Lägg telefonen <b>platt</b> på en puttingmatta eller golvet och håll den stilla i ungefär en sekund. Den startar av sig själv. <b>Lyft telefonen för att stoppa.</b> Du kan stänga av autostart i Inställningar.</p>
<p>Vill du starta med telefonen i handen trycker du på <b>Start-knappen</b> eller var som helst på skärmen. Därefter stoppar den när du lyfter telefonen först efter att du har lagt den platt. Tryck på skärmen för att stoppa medan du tränar.</p>
<ul><li>När <b>staven går ner</b> är det baksvinget.</li><li>Längst <b>ner</b> går det över i framsvinget.</li><li>I ögonblicket då staven <b>når toppen</b> är det träff.</li></ul>
<p>Du hör ett ljud <b>en gång när baksvinget startar och en gång vid träffen</b>. Efter varje slag är det en sekunds paus.</p>
<p class="note">Appen mäter inte ditt slag. Den visar en rytm att öva med, utan sensorer eller extra utrustning. Skärmen förblir på medan du tränar.</p>`],
      ["Välj tempo", `<p>Det stora talet på startskärmen är <b>bpm</b>: hur många gånger per minut du skulle kunna upprepa samma slag, från start på baksvinget till träff. <b>60 ÷ sekunder = bpm</b>.</p>
<p><b>Högre bpm är snabbare, och fler sekunder är långsammare.</b> Därför visar appen alltid båda.</p>
<table><tr><th>Namn</th><th>Totalt</th><th>bpm</th><th>Bak / Fram</th></tr>
<tr><td>Snabbt tempo</td><td>0,8 s</td><td>75</td><td>0,53 / 0,27 s</td></tr>
<tr><td><b>Standardtempo</b></td><td><b>0,9 s</b></td><td><b>67</b></td><td>0,60 / 0,30 s</td></tr>
<tr><td>Långsamt tempo</td><td>1,0 s</td><td>60</td><td>0,67 / 0,33 s</td></tr></table>
<p>Välj ett på fliken <b>Tempo</b> eller finjustera i steg om 0,01 s. Du kan också välja rytmförhållande (2:1 eller 1,5:1). Standard är 2:1.</p>
<p class="note">bpm avrundas till ett heltal. Använd sekunderna för den exakta tiden.</p>`],
      ["Spara dina tempon", `<p>På fliken <b>Tempo</b> ställer du in ett tempo du gillar, skriver ett namn och trycker på <b>Spara</b>. Lämnar du namnet tomt heter det "Mitt tempo 1" och så vidare.</p>
<ul><li>Du kan spara upp till <b>5</b> tempon.</li><li>Tryck på en post i listan för att använda den direkt.</li><li>Tryck på <b>Ta bort</b> för att radera ett. När alla 5 är använda tar du bort ett för att spara ett nytt.</li></ul>
<p class="note">Sparade tempon finns <b>bara på den här telefonen</b>. De försvinner om du tar bort appen eller dess data, och de följer inte med till en annan telefon eller mellan webbversionen och appen.</p>`],
      ["Ljud- och signalinställningar", `<p>Ändra dessa på fliken <b>Inställningar</b>.</p>
<ul><li><b>Ljud</b>: välj bland 15. Tryck på ett för att höra startljudet och träffljudet.</li>
<li><b>Vändningssignal</b>: markerar ögonblicket då baksvinget slutar och framsvinget börjar. Välj Av, Skärmblink (standard), Glöd nedtill, Stavblink eller Ringar.</li>
<li><b>Autostart</b>: startar när du lägger ner telefonen och stoppar när du lyfter den.</li>
<li>Du kan också ändra <b>stavens tjocklek</b> och <b>språket</b> (한국어, 日本語, 简体中文, English, Español, Deutsch, Français, Svenska, Italiano).</li></ul>
<p class="note">Inget ljud? Kontrollera ljudlöst läge och volymen. På iPhone kan du bli ombedd att tillåta åtkomst till rörelsesensorer första gången.</p>`],
      ["Så tränar du", `<p>Det här är <b>förslag</b> baserade på forskning och på hur appen fungerar. De är inte beprövade recept.</p>
<ul><li><b>Börja med standardtempot (0,9 s).</b></li>
<li>Ändra <b>ett steg (0,1 s) i taget</b>. Stora hopp är svåra att jämföra.</li>
<li>Sätt <b>komforten först</b>. Ett snabbare eller långsammare tempo är inte bättre i sig. Målet är en takt du kan upprepa varje gång.</li>
<li>Behåll <b>samma tid</b> för olika avstånd och ändra <b>slagets storlek</b> istället.</li>
<li>Träna i <b>korta set</b>, till exempel 3 set om 10 med 1 till 2 minuters vila.</li>
<li>Använd den för att värma upp före en runda, och putta sedan på banan utan appen.</li>
<li>Enbart tempo löser inte din putting. Titta på <b>vart bollen tar vägen</b> och hur långt.</li></ul>`],
      ["Vad bygger tempot på?", `<p>Standardvärdet 0,9 s kommer från studier där skickliga golfare mättes: tiden från start på baksvinget till träff var ungefär <b>0,86 till 0,99 s</b>, och förhållandet mellan baksving och framsving var cirka <b>2:1</b>.</p>
<table><tr><th>Studie</th><th>Spelare</th><th>Start till träff</th></tr>
<tr><td>Marquardt (2007)</td><td>99 tourspelare</td><td>cirka 0,99 s i snitt, förhållande cirka 2,1</td></tr>
<tr><td>Couceiro et al. (2022)</td><td>10 skickliga män</td><td>cirka 0,86 till 0,90 s</td></tr></table>
<p><b>Bra att veta</b></p>
<ul><li><b>Det finns inget enda rätt tempo.</b> Även i samma studie skilde sig spelarna åt i hastighet. Det de hade gemensamt var att de höll sitt eget tempo jämnt.</li>
<li>Inget experiment visar att det här tempot höjer din träffprocent. Appen är <b>ett verktyg för att öva ett jämnt tempo</b>.</li>
<li>Siffror i böcker eller videor kan skilja sig från de i appen. Om den uppmätta delen av slaget är en annan betyder samma siffra ett annat tempo.</li></ul>`],
      ["Vanliga frågor", `<p><b>Jag tryckte på Start men inget hände.</b><br>Det startar efter en stund. Det startar också av sig själv när du lägger ner telefonen. Hör du inget, kontrollera ljudlöst läge och volym.</p>
<p><b>Mäter den min slagtid?</b><br>Nej. Den visar bara en rytm.</p>
<p><b>Betyder högre bpm snabbare?</b><br>Ja. bpm är hur många per minut och sekunder är hur lång tid ett tar, så de går åt motsatta håll.</p>
<p><b>Syns mina sparade tempon på en annan telefon?</b><br>Nej. De sparas bara på den här telefonen.</p>`]
    ],
    it: [
      ["Per iniziare", `<p>Appoggia il telefono <b>in piano</b> su un tappeto da putt o sul pavimento e tienilo fermo per circa un secondo. Parte da solo. <b>Solleva il telefono per fermare.</b> Puoi disattivare l'avvio automatico nelle Impostazioni.</p>
<p>Per iniziare con il telefono in mano, tocca il <b>pulsante Avvia</b> o un punto qualsiasi dello schermo. Dopo, sollevare il telefono lo ferma solo dopo che l'hai appoggiato in piano. Mentre ti alleni, tocca lo schermo per fermare.</p>
<ul><li>Mentre la <b>barra scende</b> sei nel backswing.</li><li>In <b>basso</b> diventa il movimento in avanti.</li><li>Il momento in cui la barra <b>arriva in alto</b> è l'impatto.</li></ul>
<p>Senti un suono <b>una volta all'inizio del backswing e una volta all'impatto</b>. Dopo ogni colpo c'è una pausa di un secondo.</p>
<p class="note">L'app non misura il tuo colpo. Mostra un ritmo con cui allenarti, senza sensori né attrezzatura. Lo schermo resta acceso mentre ti alleni.</p>`],
      ["Scegliere il tempo", `<p>Il grande numero nella schermata principale è in <b>bpm</b>: quante volte al minuto potresti ripetere lo stesso colpo, dall'inizio del backswing all'impatto. <b>60 ÷ secondi = bpm</b>.</p>
<p><b>Più bpm significa più veloce, più secondi significa più lento.</b> Per questo l'app mostra sempre entrambi.</p>
<table><tr><th>Nome</th><th>Totale</th><th>bpm</th><th>Indietro / Avanti</th></tr>
<tr><td>Tempo veloce</td><td>0,8 s</td><td>75</td><td>0,53 / 0,27 s</td></tr>
<tr><td><b>Tempo standard</b></td><td><b>0,9 s</b></td><td><b>67</b></td><td>0,60 / 0,30 s</td></tr>
<tr><td>Tempo lento</td><td>1,0 s</td><td>60</td><td>0,67 / 0,33 s</td></tr></table>
<p>Scegline uno nella scheda <b>Tempo</b> o regolalo a passi di 0,01 s. Puoi anche scegliere il rapporto ritmico (2:1 o 1,5:1). Quello predefinito è 2:1.</p>
<p class="note">I bpm sono arrotondati a un numero intero. Per il tempo esatto guarda i secondi.</p>`],
      ["Salvare i tuoi tempi", `<p>Nella scheda <b>Tempo</b>, imposta un tempo che ti piace, scrivi un nome e tocca <b>Salva</b>. Se lasci il nome vuoto si chiama «Il mio tempo 1» e così via.</p>
<ul><li>Puoi salvare fino a <b>5</b> tempi.</li><li>Tocca un elemento della lista per usarlo subito.</li><li>Tocca <b>Elimina</b> per rimuoverne uno. Quando tutti e 5 sono usati, eliminane uno per salvarne un altro.</li></ul>
<p class="note">I tempi salvati restano <b>solo su questo telefono</b>. Si perdono se elimini l'app o i suoi dati e non passano a un altro telefono né tra la versione web e l'app.</p>`],
      ["Impostazioni di suono e segnale", `<p>Le modifichi nella scheda <b>Impostazioni</b>.</p>
<ul><li><b>Suono</b>: scegli tra 15. Toccane uno per sentire il suono di inizio e quello dell'impatto.</li>
<li><b>Segnale di cambio</b>: indica il momento in cui finisce il backswing e inizia il movimento in avanti. Scegli tra No, Lampo schermo (predefinito), Luce in basso, Lampo barra od Onda.</li>
<li><b>Avvio automatico</b>: parte quando appoggi il telefono e si ferma quando lo sollevi.</li>
<li>Puoi cambiare anche lo <b>spessore della barra</b> e la <b>lingua</b> (한국어, 日本語, 简体中文, English, Español, Deutsch, Français, Svenska, Italiano).</li></ul>
<p class="note">Non senti nulla? Controlla la modalità silenziosa e il volume. Su iPhone la prima volta potrebbe essere richiesto di consentire l'accesso al movimento.</p>`],
      ["Come allenarti", `<p>Sono <b>suggerimenti</b> basati su ricerche e sul funzionamento dell'app. Non sono una prescrizione provata.</p>
<ul><li><b>Inizia con il tempo standard (0,9 s).</b></li>
<li>Cambialo <b>un passo (0,1 s) alla volta</b>. I salti grandi sono difficili da confrontare.</li>
<li>Metti al primo posto la <b>comodità</b>. Un tempo più veloce o più lento non è migliore di per sé. L'obiettivo è un ritmo che puoi ripetere ogni volta.</li>
<li>Mantieni lo <b>stesso tempo</b> per distanze diverse e cambia invece l'<b>ampiezza del colpo</b>.</li>
<li>Allenati in <b>serie brevi</b>, per esempio 3 serie da 10 con 1-2 minuti di pausa.</li>
<li>Usala per scaldarti prima del giro, poi putta in campo senza l'app.</li>
<li>Il solo tempo non basta a sistemare il tuo putt. Guarda <b>dove va la palla</b> e quanto lontano.</li></ul>`],
      ["Su cosa si basa il tempo?", `<p>Il valore predefinito di 0,9 s viene da studi su golfisti esperti: il tempo dall'inizio del backswing all'impatto era circa <b>0,86-0,99 s</b>, e il rapporto tra backswing e movimento in avanti circa <b>2:1</b>.</p>
<table><tr><th>Studio</th><th>Giocatori</th><th>Dall'inizio all'impatto</th></tr>
<tr><td>Marquardt (2007)</td><td>99 giocatori del tour</td><td>circa 0,99 s in media, rapporto circa 2,1</td></tr>
<tr><td>Couceiro et al. (2022)</td><td>10 uomini esperti</td><td>circa 0,86-0,90 s</td></tr></table>
<p><b>Da sapere</b></p>
<ul><li><b>Non esiste un unico tempo giusto.</b> Anche nello stesso studio i giocatori avevano velocità diverse. Avevano in comune il mantenere stabile il proprio tempo.</li>
<li>Nessun esperimento dimostra che questo tempo aumenti la percentuale di successo. Questa app è <b>uno strumento per allenare un tempo costante</b>.</li>
<li>I numeri nei libri o nei video possono differire da quelli dell'app. Se la parte misurata del colpo è diversa, lo stesso numero indica un tempo diverso.</li></ul>`],
      ["Domande frequenti", `<p><b>Ho toccato Avvia ma non è partito nulla.</b><br>Parte dopo un attimo. Parte anche da solo quando appoggi il telefono. Se non senti nulla, controlla la modalità silenziosa e il volume.</p>
<p><b>Misura il tempo del mio colpo?</b><br>No. Mostra solo un ritmo.</p>
<p><b>Più bpm significa più veloce?</b><br>Sì. I bpm sono quante volte al minuto e i secondi sono la durata di una volta, quindi vanno in direzioni opposte.</p>
<p><b>I miei tempi salvati compaiono su un altro telefono?</b><br>No. Sono memorizzati solo su questo telefono.</p>`]
    ]

    '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><circle cx="12" cy="17" r="0.7" fill="currentColor"/>'

  function renderManual() {
    manualBody.textContent = '';
    MAN[lang].forEach(function (sec, i) {
      var d = document.createElement('details');
      if (i === 0) d.open = true;
      var sm = document.createElement('summary');
      var ic = document.createElement('span');
      ic.className = 'man-ic';
      ic.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (MAN_ICONS[i] || '') + '</svg>';
      var ti = document.createElement('span');
      ti.textContent = sec[0];
      sm.appendChild(ic);
      sm.appendChild(ti);
      var c = document.createElement('div');
      c.className = 'man-c';
      c.innerHTML = (i === 0 ? figFlat() + figBar() : i === 1 ? figTime() : '') + sec[1];
      if (i === 0) { var steps = c.querySelector('ul'); if (steps) steps.className = 'man-steps'; }
      d.appendChild(sm);
      d.appendChild(c);
      manualBody.appendChild(d);
    });
    manualBody.scrollTop = 0;
  }

  function showManual() {
    renderManual();
    scrimEl.hidden = false;
    manualEl.hidden = false;
    if (scrimEl.animate) scrimEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, easing: 'ease-out' });
    if (manualEl.animate) manualEl.animate([{ opacity: 0, transform: 'translateY(28px) scale(0.98)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(0.34, 1.3, 0.64, 1)' });
  }

  function hideManual() {
    var done = function () { manualEl.hidden = true; if (howtoEl.hidden) scrimEl.hidden = true; };
    if (!manualEl.animate) { done(); return; }
    manualEl.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(20px)' }], { duration: 200, easing: 'ease-in' }).onfinish = done;
  }

  document.getElementById('manualRow').addEventListener('click', showManual);
  document.getElementById('manualClose').addEventListener('click', hideManual);
  document.getElementById('howtoMore').addEventListener('click', showManual);

  function showHowto() {
    scrimEl.hidden = false;
    howtoEl.hidden = false;
    if (scrimEl.animate) scrimEl.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, easing: 'ease-out' });
    if (howtoEl.animate) howtoEl.animate([{ opacity: 0, transform: 'translateY(32px) scale(0.97)' }, { opacity: 1, transform: 'none' }], { duration: 480, easing: 'cubic-bezier(0.34, 1.4, 0.64, 1)' });
  }

  function hideHowto() {
    try { localStorage.setItem('putting-tempo-howto', '1'); } catch (e) {}
    var done = function () { howtoEl.hidden = true; scrimEl.hidden = true; setTimeout(showInstall, 700); };
    if (!howtoEl.animate) { done(); return; }
    scrimEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220 });
    howtoEl.animate([{ opacity: 1 }, { opacity: 0, transform: 'translateY(24px)' }], { duration: 220, easing: 'ease-in' }).onfinish = done;
  }

  document.getElementById('howtoGo').addEventListener('click', hideHowto);
  scrimEl.addEventListener('click', function () { if (!manualEl.hidden) hideManual(); else hideHowto(); });
  document.getElementById('howtoRow').addEventListener('click', showHowto);
  setTimeout(function () { if (!howtoSeen() && !forceInstall) showHowto(); }, 1100);

  // ---- splash: logo while fonts load ----
  (function () {
    var splash = document.getElementById('splash');
    var logoImg = document.querySelector('.logo');
    if (logoImg) splash.firstElementChild.src = logoImg.src;
    var minWait = new Promise(function (r) { setTimeout(r, 550); });
    var fonts = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    Promise.all([minWait, Promise.race([fonts, new Promise(function (r) { setTimeout(r, 2500); })])]).then(function () {
      if (!splash.animate) { splash.remove(); return; }
      splash.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: 'ease-out', fill: 'forwards' }).onfinish = function () { splash.remove(); };
    });
  })();

  // ---- home preview: the bar moves at the chosen tempo (same easing and rest as the real screen) ----
  var pvRaf = 0;
  var pvT0 = 0;
  var pvBar = document.getElementById('pvBar');
  var pvBall = document.getElementById('pvBall');
  var pvTrack = document.getElementById('pvTrack');
  var pvBack = document.getElementById('pvBack');
  var pvFwd = document.getElementById('pvFwd');
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function pvActive() {
    return !running && tab === 'home' && !document.hidden && !homeEl.hidden && !reduceMotion;
  }

  function pvSet(y, hit, turn, phase) {
    var travel = pvTrack.clientHeight - pvBar.offsetHeight;
    pvBar.style.transform = 'translateY(' + (y * travel) + 'px)';
    pvBar.classList.toggle('hit', hit);
    pvBall.classList.toggle('hit', hit);
    pvTrack.classList.toggle('turn', turn);
    pvBack.classList.toggle('on', phase === 1);
    pvFwd.classList.toggle('on', phase === 2);
  }

  function pvFrame(now) {
    if (!pvActive()) { pvRaf = 0; pvSet(0, false, false, 0); return; }
    var t = (now - pvT0) / 1000;
    var ph = t % (STROKE + 1);
    var y = 0, hit = false, turn = false, phase = 0;
    if (ph < BACK) {
      y = easeInOut(ph / BACK);
      phase = 1;
    } else if (ph < STROKE) {
      y = 1 - easeInOut((ph - BACK) / FWD);
      phase = 2;
      turn = ph - BACK < 0.16;
    } else {
      hit = ph < STROKE + 0.18;
    }
    pvSet(y, hit, turn, phase);
    pvRaf = requestAnimationFrame(pvFrame);
  }

  function pvStart() {
    if (!pvTrack) return;
    if (reduceMotion) { pvSet(0.45, false, false, 0); return; }
    pvT0 = performance.now();
    if (!pvRaf && pvActive()) pvRaf = requestAnimationFrame(pvFrame);
  }

  document.addEventListener('visibilitychange', function () { if (!document.hidden) pvStart(); });

  function applyLang() {
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    document.getElementById('buyLink').href = t('buyUrl');
    document.getElementById('logoLink').href = t('buyUrl');
    document.title = t('title');
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.innerHTML = t(el.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    goBtn.textContent = running ? stopLabel() : t('start');
    renderPresets();
    renderHome();
    renderSummaries();
    syncSegs();
    document.getElementById('saveName').placeholder = t('namePh');
    if (typeof renderManual === 'function' && manualEl && !manualEl.hidden) renderManual();
    renderSaved();
    if (!measureEl.hidden) renderMeasure();
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('putting-tempo-lang', lang); } catch (e) {}
      applyLang();
    });
  });

  applyTempo();
  applyBar();
  applyTurn();
  applyAuto();
  applyLang();
  renderSettings();
  updateTabbar();
  pvStart();
  window.addEventListener("load", function () { updateTabbar(); pvStart(); });

  if ('serviceWorker' in navigator && location.protocol !== 'file:' && !window.Capacitor) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
