<style>
/* Brand: Redstick homepage system (ink #0A0504, red #C8151D, Sora for display, Noto Sans KR for body). Layout: the whole screen is the track (bar runs top edge to bottom edge). A floating panel holds the home view and a settings view (sounds). While running only the stop button stays. */
:root {
  --bg: #0A0504;
  --surface: #1A1A1A;
  --line: #3A3432;
  --fg: #FFFFFF;
  --muted: #A9A5A4;
  --accent: #C8151D;
  --on-accent: #FFFFFF;
  --warm: #F4F1EC;
  --ball: 84px;
  --font: "Noto Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-display: "Sora", "Noto Sans KR", system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  overflow: hidden;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.track { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
.bar {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 14px;
  background: var(--accent);
  will-change: transform;
}
.bar.hit { background: var(--fg); }
.ball {
  position: absolute;
  top: calc(-0.5 * var(--ball));
  left: 50%;
  width: var(--ball);
  height: var(--ball);
  margin-left: calc(-0.5 * var(--ball));
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(0, 0, 0, 0.1) 1.4px, transparent 2.2px) 0 0 / 9px 9px,
    radial-gradient(circle at 35% 62%, #fff 0, #f2efea 48%, #c9c3bc 100%);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.7);
  transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
}
.ball.hit { transform: translateY(5px) scale(1.06); box-shadow: 0 0 0 4px rgba(200, 21, 29, 0.55), 0 6px 18px rgba(0, 0, 0, 0.7); }

.panel {
  position: fixed;
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  top: 50%;
  transform: translateY(-50%);
  margin-inline: auto;
  max-width: 380px;
  max-height: calc(100dvh - 32px);
  overflow-y: auto;
  padding: 22px 18px;
  border-radius: 8px;
  background: rgba(10, 5, 4, 0.96);
  border: 2px solid var(--line);
}
.home, .settings { display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1, h2 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.logo { display: block; height: 26px; width: auto; align-self: flex-start; }
.kicker { margin: 0 0 4px; font: 700 12px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.icon-btn {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: transparent;
  color: var(--fg);
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.facts { display: flex; justify-content: center; align-items: baseline; gap: 10px; font-variant-numeric: tabular-nums; }
.big { font-family: var(--font-display); font-size: 44px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
.facts .unit { font-size: 16px; font-weight: 700; color: var(--muted); }
.tip { margin: 0; font-size: 15px; line-height: 1.6; color: var(--muted); text-align: center; text-wrap: balance; }
.label { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.go {
  width: 100%;
  min-height: 64px;
  border-radius: 2px;
  border: 0;
  background: var(--accent);
  color: var(--on-accent);
  font: 800 24px/1 var(--font-display);
  cursor: pointer;
}
button:focus-visible, a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill {
  flex: 1 1 calc(33% - 8px);
  min-height: 48px;
  padding-inline: 8px;
  border-radius: 2px;
  border: 2px solid var(--line);
  background: transparent;
  color: var(--fg);
  font: 700 16px var(--font);
  cursor: pointer;
}
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.sounds { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.snd {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 92px;
  padding: 10px 4px;
  border-radius: 16px;
  border: 2px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  font: 700 14px var(--font);
  cursor: pointer;
  transition: transform 0.1s ease-out, background 0.15s;
}
.snd:active { transform: scale(0.94); }
.snd svg { display: block; }
.snd[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.snd small { font: 500 12px/1 var(--font); color: var(--muted); margin-top: -4px; }
.snd[aria-pressed="true"] small { color: var(--on-accent); }
.type-line { text-align: center; color: var(--accent); font-size: 17px; margin-top: -6px; }
#typeLine:empty, #tipLine:empty { display: none; }
.brand { align-self: center; font: 600 13px var(--font-display); color: var(--muted); text-decoration: none; letter-spacing: 0.04em; padding: 6px 10px; }

.msg { margin: 0; min-height: 1.6em; font-size: 14px; font-weight: 700; color: var(--warm); }

.mode { display: flex; gap: 8px; }
.measure { display: flex; flex-direction: column; gap: 16px; }
.tap {
  width: 100%;
  min-height: 170px;
  padding: 16px;
  border-radius: 2px;
  border: 2px dashed var(--muted);
  background: transparent;
  color: var(--fg);
  font: 800 26px/1.3 var(--font-display);
  text-wrap: balance;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.tap:active { background: var(--surface); border-color: var(--accent); }
.tap small { display: block; margin-top: 10px; font: 500 14px/1.5 var(--font); color: var(--muted); }
.step { margin: 0; font: 700 12px/1 var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--muted); display: block; }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.chip { font: 700 15px/30px var(--font-display); font-variant-numeric: tabular-nums; border: 2px solid var(--line); border-radius: 2px; padding: 0 10px; }
.chip.warn { font: 700 13px/30px var(--font); border-color: var(--accent); color: var(--warm); }
.result { margin: 0; text-align: center; font: 800 20px/1.3 var(--font-display); font-variant-numeric: tabular-nums; color: var(--warm); min-height: 1.3em; }
.go:disabled { opacity: 0.4; cursor: default; }
.ghost { width: 100%; min-height: 48px; border-radius: 2px; border: 2px solid var(--line); background: transparent; color: var(--fg); font: 700 16px var(--font); cursor: pointer; }

/* running: the phone lies flat and the player looks down at it, so the stroke runs left-right in their view
   (phone top -> bottom = player's left -> right). Rotate the whole UI 90deg so the logo and text read upright:
   logo top-left, hint top-right. Tapping anywhere stops. Left-handed players get the mirrored rotation. */
.panel.running {
  inset: 0;
  transform: none;
  max-width: none;
  max-height: none;
  margin: 0;
  padding: 0;
  overflow: visible;
  background: transparent;
  border: 0;
  pointer-events: none;
}
.panel.running .home {
  display: block;
  position: absolute;
  left: 0;
  top: 0;
  width: 100vh;
  width: 100dvh;
  height: 100vw;
  transform-origin: 0 0;
  transform: translateX(100vw) rotate(90deg);
  --lead: 46px;
  --side: 18px;
}
.panel.running.lefty .home { transform: translateY(100vh) rotate(-90deg); transform: translateY(100dvh) rotate(-90deg); --lead: 18px; --side: 46px; }
.panel.running .extra:not(.logo) { display: none; }
.panel.running .logo { position: absolute; left: var(--lead); top: 18px; height: 20px; opacity: 0.9; }
.panel.running .go {
  position: absolute;
  right: var(--side);
  top: 18px;
  width: auto;
  min-height: 0;
  padding: 0;
  background: transparent;
  color: var(--muted);
  font: 500 13px/1.3 var(--font);
  text-align: right;
  opacity: 0.8;
}
.sounds.two { grid-template-columns: repeat(2, 1fr); }
</style>

  <div id="ball" class="ball"></div>

    timer = setTimeout(schedule, 25);
  }

  function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

  function frame() {
    if (!running) return;
    var t = ctx.currentTime - baseT;
    var travel = trackEl.clientHeight - barEl.offsetHeight;   // very top to very bottom
    var y = 0;
    var hit = false;
    if (t >= 0) {
      var ph = t % CYCLE;
      if (ph < BACK) {
        y = easeInOut(ph / BACK);
      } else if (ph < STROKE) {
        y = 1 - easeInOut((ph - BACK) / FWD);
      } else {
        y = 0;
        hit = ph < STROKE + 0.18;
      }
    }
    barEl.style.transform = 'translateY(' + (y * travel) + 'px)';
    if (hit !== wasHit) {
      barEl.classList.toggle('hit', hit);
      ballEl.classList.toggle('hit', hit);
      wasHit = hit;
    }
    raf = requestAnimationFrame(frame);
  }

  function lockScreen() {
    try {
      if (navigator.wakeLock && navigator.wakeLock.request) {
        navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; }, function () {});
      }
    } catch (e) {}
  }

  function unlockScreen() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }

  function start() {
    if (!ensureCtx()) return;
    running = true;
    baseT = ctx.currentTime + 1.2;
    nextN = 0;
    schedule();
    panelEl.classList.add('running');
    goBtn.textContent = t('stop');
    goBtn.setAttribute('aria-pressed', 'true');
    lockScreen();
    raf = requestAnimationFrame(frame);
  }

  function stop() {
    running = false;
    clearTimeout(timer);
    cancelAnimationFrame(raf);
    barEl.style.transform = 'translateY(0)';
    barEl.classList.remove('hit');
    ballEl.classList.remove('hit');
    wasHit = false;
    panelEl.classList.remove('running');
    goBtn.textContent = t('start');
    goBtn.setAttribute('aria-pressed', 'false');
    unlockScreen();
  }

  function showSettings(on) {
    settingsEl.hidden = !on;
    homeEl.hidden = on;
    msgEl.textContent = '';
    if (on) { renderSettings(); settingsEl.scrollTop = 0; panelEl.scrollTop = 0; }
  }

  goBtn.addEventListener('click', function () {
    if (running) stop(); else start();
  });
  document.getElementById('gearBtn').addEventListener('click', function () { showSettings(true); });
  document.getElementById('backBtn').addEventListener('click', function () { showSettings(false); });

  soundBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var name = b.getAttribute('data-sound');
      preview(name);
      sound = name;
      try { localStorage.setItem('putting-tempo-sound', sound); } catch (e) {}
      renderSettings();
    });
  });

  // Tap anywhere on the home view to start / stop (buttons, links and the settings view are excluded).
  document.addEventListener('click', function (e) {
    if (e.target.closest('button, a, #settings, #measure')) return;
    if (!settingsEl.hidden || !document.getElementById('measure').hidden) return;
    if (running) stop(); else start();
  });

  // ---- 나의 템포 찾기: three taps (start, end of backswing, impact) give backswing and forward times ----
  var measureEl = document.getElementById('measure');
  var mode = 'tour';
  var mine = null;
  var taps = [];
  var trials = [];
  var warn = '';

  try {
    var m = JSON.parse(localStorage.getItem('putting-tempo-mine') || 'null');
    if (m && m.back > 0.2 && m.fwd > 0.1) mine = m;
  } catch (e) {}
  try { if (mine && localStorage.getItem('putting-tempo-mode') === 'mine') mode = 'mine'; } catch (e) {}

  function applyTempo() {
    var T = (mode === 'mine' && mine) ? mine : TOUR;
    BACK = T.back;
    FWD = T.fwd;
    STROKE = BACK + FWD;
    CYCLE = STROKE + 1;
  }

  function renderHome() {
    document.getElementById('modeTour').setAttribute('aria-pressed', String(mode === 'tour'));
    document.getElementById('modeMine').setAttribute('aria-pressed', String(mode === 'mine'));
    document.getElementById('factRatio').textContent = (BACK / FWD).toFixed(1) + ' : 1';
    document.getElementById('factTotal').textContent = t('total')(+STROKE.toFixed(2));
    document.getElementById('remeasure').hidden = mode !== 'mine';
    var ht = document.getElementById('homeType');
    ht.hidden = !(mode === 'mine' && mine);
    if (!ht.hidden) ht.textContent = t('type_' + typeOf(mine));
  }

  function setMode(next) {
    if (running) stop();
    if (next === 'mine' && !mine) { showMeasure(true); return; }
    mode = next;
    try { localStorage.setItem('putting-tempo-mode', mode); } catch (e) {}
    applyTempo();
    renderHome();
  }

  function showMeasure(on) {
    if (running) stop();
    measureEl.hidden = !on;
    homeEl.hidden = on;
    settingsEl.hidden = true;
    if (on) { taps = []; trials = []; warn = ''; renderMeasure(); panelEl.scrollTop = 0; }
    else renderHome();
  }

  function average() {
    if (!trials.length) return null;
    var a = 0, b = 0;
    trials.forEach(function (t) { a += t.back; b += t.fwd; });
    return { back: a / trials.length, fwd: b / trials.length };
  }


  function renderMeasure() {
    var step = taps.length;
    var STEPS = t('steps');
    document.getElementById('stepLabel').textContent = STEPS[step][0];
    document.getElementById('tapMain').textContent = STEPS[step][1];
    document.getElementById('tapSub').textContent = STEPS[step][2];
    Array.prototype.forEach.call(document.getElementById('dots').children, function (d, i) {
      d.className = i < step ? 'on' : '';
    });
    var box = document.getElementById('chips');
    box.textContent = '';
    if (warn) {
      var w = document.createElement('span');
      w.className = 'chip warn';
      w.textContent = warn;
      box.appendChild(w);
    }
    trials.forEach(function (t) {
      var c = document.createElement('span');
      c.className = 'chip';
      c.textContent = t.back.toFixed(2) + ' : ' + t.fwd.toFixed(2);
      box.appendChild(c);
    });
    var avg = average();
    document.getElementById('result').textContent = avg
      ? t('avg') + avg.back.toFixed(2) + ' : ' + avg.fwd.toFixed(2) + '  (' + (avg.back / avg.fwd).toFixed(1) + ' : 1)'
      : '';
    document.getElementById('typeLine').textContent = avg ? t('type_' + typeOf(avg)) + ' · ' + t('sec')(+(avg.back + avg.fwd).toFixed(2)) : '';
    document.getElementById('tipLine').textContent = avg ? t(tipOf(avg)) : '';
    document.getElementById('mineSave').disabled = !avg;
  }

  function onTap() {
    if (!ensureCtx()) return;
    var t = performance.now() / 1000;
    if (taps.length && t - taps[taps.length - 1] > 3.5) taps = [];
    play(ctx.currentTime + 0.005, taps.length === 2 ? 'impact' : 'start');
    taps.push(t);
    warn = '';
    if (taps.length === 3) {
      var b = taps[1] - taps[0];
      var f = taps[2] - taps[1];
      taps = [];
      if (b < 0.25 || b > 2.5 || f < 0.12 || f > 1.5) {
        warn = t('warn');
      } else {
        trials.push({ back: b, fwd: f });
        if (trials.length > 5) trials.shift();
      }
    }
    renderMeasure();
  }

  document.getElementById('tapBtn').addEventListener('pointerdown', function (e) { e.preventDefault(); onTap(); });
  document.getElementById('tapBtn').addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); onTap(); }
  });
  document.getElementById('mineReset').addEventListener('click', function () { taps = []; trials = []; warn = ''; renderMeasure(); });
  document.getElementById('measureBack').addEventListener('click', function () { showMeasure(false); });
  document.getElementById('mineSave').addEventListener('click', function () {
    var avg = average();
    if (!avg) return;
    mine = { back: +avg.back.toFixed(3), fwd: +avg.fwd.toFixed(3) };
    try { localStorage.setItem('putting-tempo-mine', JSON.stringify(mine)); } catch (e) {}
    mode = 'mine';
    try { localStorage.setItem('putting-tempo-mode', mode); } catch (e) {}
    applyTempo();
    showMeasure(false);
  });
  document.getElementById('modeTour').addEventListener('click', function () { setMode('tour'); });
  document.getElementById('modeMine').addEventListener('click', function () { setMode('mine'); });
  document.getElementById('remeasure').addEventListener('click', function () { showMeasure(true); });

  var hand = 'r';
  try { if (localStorage.getItem('putting-tempo-hand') === 'l') hand = 'l'; } catch (e) {}

  function applyHand() {
    panelEl.classList.toggle('lefty', hand === 'l');
    Array.prototype.forEach.call(document.querySelectorAll('[data-hand]'), function (b) {
      b.setAttribute('aria-pressed', String(b.getAttribute('data-hand') === hand));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-hand]'), function (b) {
    b.addEventListener('click', function () {
      hand = b.getAttribute('data-hand');
      try { localStorage.setItem('putting-tempo-hand', hand); } catch (e) {}
      applyHand();
    });
  });

  var BAR_SIZES = [8, 14, 24];
  var barSize = 14;
  try {
    var savedBar = parseInt(localStorage.getItem('putting-tempo-bar'), 10);
    if (BAR_SIZES.indexOf(savedBar) >= 0) barSize = savedBar;
  } catch (e) {}

  function applyBar() {
    barEl.style.height = barSize + 'px';
    Array.prototype.forEach.call(document.querySelectorAll('[data-bar]'), function (b) {
      b.setAttribute('aria-pressed', String(parseInt(b.getAttribute('data-bar'), 10) === barSize));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-bar]'), function (b) {
    b.addEventListener('click', function () {
      barSize = parseInt(b.getAttribute('data-bar'), 10);
      try { localStorage.setItem('putting-tempo-bar', String(barSize)); } catch (e) {}
      applyBar();
    });
  });

  var PRESETS = { slow: { back: 0.73, fwd: 0.37 }, tour: { back: 0.6, fwd: 0.3 }, fast: { back: 0.5, fwd: 0.25 } };

  // Type by total stroke time vs. the 0.9 s tour average; tip by backswing:forward ratio vs. the tour 1.8-2.2.
  function typeOf(T) {
    var total = T.back + T.fwd;
    return total < 0.8 ? 'fast' : total > 1.0 ? 'slow' : 'tour';
  }
  function tipOf(T) {
    var r = T.back / T.fwd;
    return r < 1.8 ? 'tip_short' : r > 2.2 ? 'tip_long' : 'tip_ok';
  }

  function renderPresets() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-preset-sec]'), function (el) {
      var T = PRESETS[el.getAttribute('data-preset-sec')];
      el.textContent = t('sec')(+(T.back + T.fwd).toFixed(2));
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-preset]'), function (b) {
    b.addEventListener('click', function () {
      var T = PRESETS[b.getAttribute('data-preset')];
      mine = { back: T.back, fwd: T.fwd };
      try { localStorage.setItem('putting-tempo-mine', JSON.stringify(mine)); } catch (e) {}
      mode = 'mine';
      try { localStorage.setItem('putting-tempo-mode', mode); } catch (e) {}
      applyTempo();
      showMeasure(false);
    });
  });

  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.innerHTML = t(el.getAttribute('data-i18n')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-aria]'), function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
    goBtn.textContent = running ? t('stop') : t('start');
    renderPresets();
    renderHome();
    if (!measureEl.hidden) renderMeasure();
  }

  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) {
    b.addEventListener('click', function () {
      lang = b.getAttribute('data-lang');
      try { localStorage.setItem('putting-tempo-lang', lang); } catch (e) {}
      applyLang();
    });
  });

  applyTempo();
  applyBar();
  applyHand();
  applyLang();
  renderSettings();

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
